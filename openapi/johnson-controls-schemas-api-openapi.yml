openapi: 3.2.0
info:
  title: Johnson Controls Schemas API
  version: Version 6 for 16.0
  x-logo:
    url: source/images/logo.svg
    href: https://jci-metasys.github.io/
  x-releases:
  - '14.0'
  - '14.1'
  - '15.0'
  - '16.0'
  x-revision: 'Commit ID: 4b227676a'
  description: 'Operations tagged schemas across 2 of this provider''s published API definitions: metasys-api-v6-16.json, johnson-controls-metasys-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: Schemas
  description: A collection of JSON schemas for describing enumerations and object types.
paths:
  /schemas/enums/{enumId}:
    get:
      tags:
      - Schemas
      summary: Get enumeration
      description: 'This operation retrieves the specified enumeration as a JSON schema. The

        path of this operation appears in several schemas of object payloads.


        To get a list of all enumerations fetch the `enumerationSetNamesEnumSet`:


        ```text

        GET /schemas/enums/enumerationSetNamesEnumSet

        ```


        **See also:**


        - Get an object'
      operationId: getEnumerationAsJsonSchema
      security: []
      parameters:
      - name: enumId
        in: path
        description: 'The enumeration to retrieve.


          The acceptable values for this parameter come from the

          `enumerationSetNamesEnumSet` enumeration. It is acceptable to use the

          short name of the value (for example, `writePriorityEnumSet` instead of

          `enumerationSetNamesEnumSet.writePriorityEnumSet`) because the

          enumeration set is known from context. Find the definition of

          `enumerationSetNamesEnumSet` at the relative URL of

          `/schemas/enums/enumerationSetNamesEnumSet`.

          '
        required: true
        schema:
          type: string
        x-metasysType: enum
        examples:
          priority:
            summary: The write priority enumeration
            value: writePriorityEnumSet
          precision:
            summary: The display precision enumeration
            value: displayPrecisionEnumSet
          all:
            summary: The set of all sets
            value: enumerationSetNamesEnumSet
      - name: Accept-Language
        description: The language to use for display text of enumeration name and members. If no language is specified the client's default language as specified in their user profile will be used.
        in: header
        schema:
          type: string
        examples:
          english:
            summary: English
            value: en-US
          spanish:
            summary: Spanish
            value: es-ES
            x-use-in-snippets: true
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                type: object
                description: A JSON schema that describes the members of an enumeration.
              examples:
                priority:
                  $ref: '#/components/examples/get-enumeration-write-priority-enum-set'
                precision:
                  $ref: '#/components/examples/get-enumeration-display-precision-enum-set'
                all:
                  $ref: '#/components/examples/get-enumeration-enumeration-set-names-enum-set'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "curl --request GET \\\n  --url https://metasys-server.example.com/api/v6/schemas/enums/writePriorityEnumSet \\\n  --header 'Accept-Language: es-ES'"
      - lang: csharp
        label: C# + Flurl
        source: "var response = await \"https://metasys-server.example.com/api/v6/schemas/enums/writePriorityEnumSet\"\n    .WithHeader(\"Accept-Language\", \"es-ES\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "Invoke-RestMethod \"https://metasys-server.example.com/api/v6/schemas/enums/writePriorityEnumSet\" `\n  -Headers @{\n    'Accept-Language' = 'es-ES'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /schemas/enums/writePriorityEnumSet `\n  -Headers @{ 'Accept-Language' = 'es-ES' }"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variable `axiosClient`\n\nconst headers = {\n  'Accept-Language': 'es-ES',\n};\n\nconst response = await axiosClient.get(\n  '/schemas/enums/writePriorityEnumSet', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object\nurl = \"/api/v6/schemas/enums/writePriorityEnumSet\"\nheaders = {\n    \"Accept-Language\": \"es-ES\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/schemas/enums/writePriorityEnumSet\"))\n    .header(\"Accept-Language\", \"es-ES\")\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /schemas/objectTypes/{objectType}:
    get:
      tags:
      - Schemas
      summary: Get object type schema
      description: 'This endpoint retrieves a schema for a specific `objectType`. The schema

        describes the properties that can be set when creating an object of the

        specific type.'
      operationId: getObjectTypeSchema
      parameters:
      - $ref: '#/components/parameters/schemasObjectType'
      - name: parentId
        description: The object under which this new object will be created.
        required: true
        in: query
        schema:
          type: string
        example: 2993aed9-5765-5641-889c-40ec968c8a82
      - $ref: '#/components/parameters/extendedProperty'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                type: object
                properties:
                  schema:
                    type: object
                    description: A JSON schema that describes valid payloads for creating an object of the specified type.
                  views:
                    $ref: '#/components/schemas/views'
              examples:
                avClass:
                  $ref: '#/components/examples/get-object-type-schema-for-av.schema'
                mvClass:
                  $ref: '#/components/examples/get-object-type-schema-for-mv.schema'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url 'https://metasys-server.example.com/api/v6/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82' \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod /schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/schemas/objectTypes/objectTypeEnumSet.avClass?parentId=2993aed9-5765-5641-889c-40ec968c8a82\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
