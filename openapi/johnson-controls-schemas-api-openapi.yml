    get-object-type-schema-for-av.schema:
      summary: Schema for avClass
      description: This schema describes the properties that can be configured when creating an object of the type avClass.
      value:
        schema:
          $comment: Some parts of this schema have been truncated for space reasons. Where this has been done it has been noted.
          type: object
          $schema: http://json-schema.org/draft-07/schema#
          title: JCI AV
          language: en-us
          version: '1.0'
          $id: https://metasys-server.example.com/api/v6/schemas/objectTypes/avClass
          properties:
            name:
              title: Name
              category: attributeCategoryEnumSet.nameCategory
              type: string
              metasysType: string
              maxLength: 400
              default: ''
            description:
              title: Description
              oneOf:
              - type: string
              - type: 'null'
              metasysType: string
              maxLength: 64
            bacnetObjectType:
              title: Object Type
              readOnly: true
              type: string
              metasysType: enum
              oneOf:
              - $ref: '#objectTypeEnumSet'
              default: objectTypeEnumSet.bacAvClass
            objectCategory:
              title: Authorization Category
              category: attributeCategoryEnumSet.objectCategoryCategory
              numberOfStates: 250
              type: string
              metasysType: enum
              oneOf:
              - $ref: '#objectCategoryEnumSet'
              default: objectCategoryEnumSet.generalCategory
            prioritySupported:
              title: Priority Supported
              type: boolean
              metasysType: bool
              default: true
            minPresValue:
              title: Min Value
              displayPrecisionSource: displayPrecision
              unitsSource: units
              metasysType: float
              type: number
              displayPrecision:
                id: displayPrecisionEnumSet.displayPrecisionPt1
                displayMultipleOf: 0.1
              default: -1.69999997607218e+38
            maxPresValue:
              title: Max Value
              displayPrecisionSource: displayPrecision
              unitsSource: units
              metasysType: float
              type: number
              displayPrecision:
                id: displayPrecisionEnumSet.displayPrecisionPt1
                displayMultipleOf: 0.1
              default: 1.69999997607218e+38
            units:
              title: Units
              type: string
              metasysType: enum
              oneOf:
              - $ref: '#unitEnumSet'
              default: unitEnumSet.noUnits
            displayPrecision:
              title: Display Precision
              numberOfStates: 13
              type: string
              metasysType: enum
              oneOf:
              - $ref: '#displayPrecisionEnumSet_endAt_13'
              default: displayPrecisionEnumSet.displayPrecisionPt1
            covIncrement:
              title: COV Increment
              unitsSource: units
              metasysType: float
              type: number
              minimum: 0
              default: 0.01
            relinquishDefault:
              title: Relinquish Default
              displayPrecisionSource: displayPrecision
              maxPresValueSource: maxPresValue
              minPresValueSource: minPresValue
              unitsSource: units
              metasysType: float
              type: number
              minimum: -1.69999997607218e+38
              maximum: 1.69999997607218e+38
              displayPrecision:
                id: displayPrecisionEnumSet.displayPrecisionPt1
                displayMultipleOf: 0.1
              default: 0
            restoreCommandPriority:
              title: Restore Command Priority
              category: attributeCategoryEnumSet.restoreCommandPriorityCategory
              type: array
              metasysType: flags
              maxItems: 4
              minItems: 4
              items:
                type: array
                items:
                - $ref: '#restorePriorityEnumSet'
                - type: boolean
              uniqueItems: true
              default:
              - - restorePriorityEnumSet.7
                - true
              - - restorePriorityEnumSet.10
                - false
              - - restorePriorityEnumSet.12
                - false
              - - restorePriorityEnumSet.15
                - false
            connectedTo:
              title: Connected To
              oneOf:
              - type: 'null'
              - $ref: '#attribute-reference'
              metasysType: attributeReference
              attributeFilter: basic
            direction:
              title: Direction
              numberOfStates: 3
              type: string
              metasysType: enum
              oneOf:
              - $ref: '#connectionDirectionSet_endAt_3'
              default: connectionDirectionSet.notConnected
            priorityForWritingToConnected:
              title: Priority For Writing to Connected Object
              metasysType: byte
              type: integer
              minimum: 1
              maximum: 16
              default: 16
          definitions:
            objectTypeEnumSet:
              $schema: http://json-schema.org/draft-07/schema#
              title: Object Type
              $id: '#objectTypeEnumSet'
              allOf:
              - oneOf:
                - const: objectTypeEnumSet.bacAvClass
                  title: AV
                  memberId: 2
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/objectTypeEnumSet
              setId: 508
            objectCategoryEnumSet:
              $schema: http://json-schema.org/draft-07/schema#
              title: Authorization Category
              $id: '#objectCategoryEnumSet'
              allOf:
              - $comment: The following list was truncated down to one entry for space reasons. Normally it would contain more entries.
                oneOf:
                - const: objectCategoryEnumSet.hvacCategory
                  title: HVAC
                  memberId: 0
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/objectCategoryEnumSet
              setId: 33
            unitEnumSet:
              $schema: http://json-schema.org/draft-07/schema#
              title: Unit
              $id: '#unitEnumSet'
              allOf:
              - $comment: The following list was truncated down to one entry for space reasons. Normally it would contain more entries.
                oneOf:
                - const: unitEnumSet.squareMeters
                  title: sq meter
                  memberId: 0
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/unitEnumSet
              setId: 507
            displayPrecisionEnumSet_endAt_13:
              $schema: http://json-schema.org/draft-07/schema#
              title: Display Precision
              $id: '#displayPrecisionEnumSet_endAt_13'
              allOf:
              - $comment: The following list was truncated down to one entry for space reasons. Normally it would contain more entries.
                oneOf:
                - const: displayPrecisionEnumSet.displayPrecisionPt000001
                  title: 1000000ths
                  memberId: 0
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/displayPrecisionEnumSet
              setId: 0
            restorePriorityEnumSet:
              $schema: http://json-schema.org/draft-07/schema#
              title: Restore Priority
              $id: '#restorePriorityEnumSet'
              allOf:
              - $comment: The following list was truncated down to one entry for space reasons. Normally it would contain more entries.
                oneOf:
                - const: restorePriorityEnumSet.7
                  title: Operator Override
                  memberId: 7
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/restorePriorityEnumSet
              setId: 357
            object-reference:
              $schema: http://json-schema.org/draft-07/schema#
              $id: '#object-reference'
              title: Object reference data type
              type: object
              properties:
                objectReference:
                  format: fully-qualified-reference
                  type: string
                referencedObject:
                  type: object
                  properties:
                    objectName:
                      type: string
                    objectUrl:
                      type: string
                      format: uri
                  readOnly: true
            attribute-reference:
              $schema: http://json-schema.org/draft-07/schema#
              $id: '#attribute-reference'
              title: Attribute reference data type
              allOf:
              - type: object
                properties:
                  attribute:
                    $ref: https://metasys-server.example.com/api/v6/schemas/enums/attributeEnumSet
                  attributeTitle:
                    type: string
                  referencedObject:
                    properties:
                      attributeUrl:
                        type: string
                        format: uri
              - $ref: '#object-reference'
            connectionDirectionSet_endAt_3:
              $schema: http://json-schema.org/draft-07/schema#
              title: Connection Value Direction
              $id: '#connectionDirectionSet_endAt_3'
              allOf:
              - $comment: The following list was truncated down to one entry for space reasons. Normally it would contain more entries.
                oneOf:
                - const: connectionDirectionSet.sendsValueTo
                  title: Sends Value To
                  memberId: 0
              - $ref: https://metasys-server.example.com/api/v6/schemas/enums/connectionDirectionSet
              setId: 3102
          required:
          - name
          - objectCategory
          - prioritySupported
          - minPresValue
          - maxPresValue
          - units
          - displayPrecision
          - covIncrement
          - relinquishDefault
          - restoreCommandPriority
          - direction
          - priorityForWritingToConnected
        views:
        - title: Configuration
          views:
          - title: Basic
            views:
            - title: Object
              properties:
              - name
              - description
              - bacnetObjectType
              - objectCategory
              id: viewGroupEnumSet.objectGrp
            - title: Engineering Values
              properties:
              - prioritySupported
              - minPresValue
              - maxPresValue
              id: viewGroupEnumSet.engValuesGrp
            - title: Display
              properties:
              - units
              - displayPrecision
              - covIncrement
              id: viewGroupEnumSet.displayGrp
            - title: Default State
              properties:
              - relinquishDefault
              id: viewGroupEnumSet.defaultStateGrp
            - title: Restart Options
              properties:
              - restoreCommandPriority
              id: viewGroupEnumSet.restartOptionsGrp
            - title: Connection Status
              properties:
              - connectedTo
              - direction
              - priorityForWritingToConnected
              id: viewGroupEnumSet.connectionStatusGrp
            id: groupTypeEnumSet.basicGrpType
          - title: Advanced
            views: []
            id: groupTypeEnumSet.advancedGrpType
          id: viewNameEnumSet.configView
