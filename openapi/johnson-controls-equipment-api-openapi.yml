  /equipment/{equipmentId}/points:
    get:
      summary: List equipment points
      description: Retrieves the collection of points defined for the specified equipment instance. Each point contains a mapping to an attribute on an object.
      operationId: getEquipmentPoints
      parameters:
      - $ref: '#/components/parameters/equipmentId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/equipmentPointsSort'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/equipmentPoints'
              examples:
                zoneTemperaturePoint:
                  $ref: '#/components/examples/get-equipment-points'
                zoneTemperaturePoint15:
                  $ref: '#/components/examples/get-equipment-points-15'
        '403':
          description: The client is not authorized to modify or delete this equipment.
          content:
            application/vnd.metasysapi.v6:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '404':
          description: The provided identifier does not match any known equipment.
          content:
            application/vnd.metasysapi.v6:
              schema:
                $ref: '#/components/schemas/errorMessage'
