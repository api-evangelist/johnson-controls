components:
  parameters:
    networkDeviceId:
      name: networkDeviceId
      description: The identifier of a network device.
      in: path
      required: true
      schema:
        type: string
      example: d9bf66bd-22f8-425b-82a4-44ba153d79c7
    equipmentSortOptional:
      name: sort
      in: query
      description: When provided, the criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        enum:
        - itemReference
        - -itemReference
        - name
        - -name
        - type
        - -type
      example: name
    depth:
      name: depth
      in: query
      example: 1
      schema:
        type: integer
        default: 1
      description: 'Specifies depth of the tree to return. For typical usage, a value or 1 or 2

        is recommended. Use `-1` for unlimited depth to return the entire tree.

        '
    page:
      name: page
      in: query
      description: The page number of items to return.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    pageSize:
      name: pageSize
      in: query
      description: The maximum number of items to return in the response.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    servedByEquipmentId:
      name: equipmentId
      in: path
      description: The identifier of the equipment instance.
      required: true
      schema:
        type: string
      example: 04d68394-3415-4813-b5ec-43d840deee38
    objectIdForEquipment:
      name: objectId
      in: path
      required: true
      example: 767d8af0-163f-552c-ba37-a884466075f9
      schema:
        type: string
      description: Specifies the root of the subtree to return for this request. The `objectId` is the identifier of the object to retrieve (optionally along with 1 or more levels of descendants).
    excludeServed:
      name: excludeServed
      in: query
      required: false
      description: 'Specifies whether the response should exclude all equipment that is

        currently serving another piece of equipment or a particular space. Only

        equipment that is unassigned and not serving any space or equipment will be

        returned

        '
      example: true
      schema:
        type: boolean
        default: false
    equipmentId:
      name: equipmentId
      in: path
      description: The identifier of the equipment instance.
      required: true
      schema:
        type: string
      example: b78fa672-3ec9-4794-bd00-7aeafeb9cde0
    spaceId:
      name: spaceId
      description: The identifier of a space.
      in: path
      required: true
      schema:
        type: string
      example: bf254f63-2cbb-4195-8c53-a1d6fcbe54f6
    equipmentPointsSort:
      name: sort
      in: query
      description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        default: shortName
        enum:
        - category
        - -category
        - isDisplayData
        - -isDisplayData
        - shortName
        - -shortName
      example: shortName
    equipmentSort:
      name: sort
      in: query
      description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        default: name
        enum:
        - itemReference
        - -itemReference
        - name
        - -name
        - type
        - -type
      example: name
  schemas:
    equipmentTreeFolder:
      type: object
      properties:
        self:
          type: string
          description: A link to this equipment tree item, either an equipment instance or a folder.
          format: uri
          readOnly: true
        id:
          type: string
          description: The identifier of the equipment tree item.
        name:
          type: string
          description: The name of the equipment instance or folder.
        itemReference:
          type: string
          description: The fully qualified reference of the equipment.
        objectType:
          type: string
          enum:
          - objectTypeEnumSet.containerClass
          x-metasysType: enum
          x-metasysEnum: objectTypeEnumSet
          description: 'The object type of the equipment tree folder. This will always be

            `objectTypeEnumSet.containerClass`.



            The values for this property come from the `objectTypeEnumSet` enumeration.

            Find the definition of `objectTypeEnumSet` at the relative URL of `/schemas/enums/objectTypeEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
        hasChildren:
          type: boolean
          description: 'Indicates if the equipment tree folder has children.

            '
        items:
          type: array
          description: 'A collection of equipment tree items, either equipment instances or

            folders, that are children of the equipment tree folder.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/equipmentTreeFolder'
            - $ref: '#/components/schemas/equipmentTreeEquipment'
    equipmentItemsLegacy:
      type: object
      properties:
        total:
          type: integer
          description: The total number of items in the collection.
        items:
          type: array
          description: Collection of equipment.
          items:
            $ref: '#/components/schemas/equipmentItemLegacy'
        next:
          type:
          - string
          - 'null'
          description: A link to the next page of results.
          format: uri
        previous:
          type:
          - string
          - 'null'
          description: A link to the previous page of results.
          format: uri
        self:
          type: string
          description: A link to this equipment collection.
          format: uri
      required:
      - total
      - items
      - next
      - previous
      - self
    equipmentItemLegacy:
      type: object
      properties:
        id:
          type: string
          description: The identifier of the object.
        itemReference:
          type: string
          description: The fully qualified reference of the object.
        name:
          type: string
          description: The full name of the equipment instance.
        type:
          type:
          - string
          - 'null'
          description: The name of the equipment definition for this equipment instance. If this instance is not associated with an equipment definition, this value will be null.
        hasUpstreamEquipment:
          type: boolean
          x-releases:
            implementedAt: '15.0'
