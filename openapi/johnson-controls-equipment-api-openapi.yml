  /equipment/tree:
    get:
      summary: Get equipment tree*
      description: 'RELEASES: 15.0 and later


        Retrieves the equipment tree from the root to the specified depth.'
      operationId: getEquipmentTree
      parameters:
      - $ref: '#/components/parameters/depth'
      - $ref: '#/components/parameters/excludeServed'
      responses:
        '200':
