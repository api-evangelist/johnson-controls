    errorMessage:
      title: Error
      description: A general error of the API.
      type: object
      additionalProperties: false
      properties:
        statusName:
          type: string
          description: 'A Metasys specific status code. The format of this code is variable. If

            the value is _unqualified_ ({enumValue}, e.g. "attributeNotFound"), then

            the display text associated to the code comes from the `statusEnumSet`

            available at `/schemas/enums/statusEnumSet`. If the value is qualified

            with just an enumeration ("{enumeration}.{member}", e.g.

            "statusEnumSet.attributeNotFound"), then the display text comes from the

            enumeration schema available at `/schemas/enums/{enumeration}`. If the

            value is qualified with a namespace

            ("{namespace}:{enumeration}.{member}", e.g.

            "api.diagram:error.saveFailed"), then the display text is the

            responsibility of the client.

            '
        message:
          type: string
          description: The display string message that correlates to `statusName`.
        details:
          type:
          - object
          - 'null'
          description: 'An object containing specific details to the type of error. Each type of

            error may have different detail properties and value types.

            '
        innerError:
          allOf:
          - description: 'An error that is more detail or a cause of the containing error.

              This allows for a recursive error structure which a client can

              digest to as much detail as they understand. This is mutually

              exclusive with `innerErrors`.

              '
          - $ref: '#/components/schemas/errorMessage'
        innerErrors:
          description: 'A collection of errors that is more detail or causes of the containing

            error. This allows for a recursive error structure which a client can

            digest to as much detail as they understand. This is mutually exclusive

            with `innerError`.

            '
          type: array
          items:
            $ref: '#/components/schemas/errorMessage'
