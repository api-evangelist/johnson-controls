  /objects/{objectId}/commands/{commandId}:
    put:
      tags:
      - Objects
      summary: Send command
      description: 'Used to send a command to an object. The payloads of commands differ, but

        they share some similarities. To learn the specifics of the commands of an

        object use `List commands`.


        **Licensing Restrictions**


        Requires Monitoring and Commanding API license.


        **See also:**


        - List commands'
      operationId: putObjectCommand
      parameters:
      - $ref: '#/components/parameters/objectId'
      - name: commandId
        required: true
        in: path
        schema:
          type: string
        example: adjustCommand
        x-metasysEnum: commandIdEnumSet
        description: 'The identifier of the command to send.


          The acceptable values for this parameter come from the `commandIdEnumSet` enumeration.

          It is acceptable to use the short name of the command identifier (for example, `adjustCommand` instead of `commandIdEnumSet.adjustCommand`) because the enumeration set is known from context.

          Find the definition of `commandIdEnumSet` at the relative URL of `/schemas/enums/commandIdEnumSet`.


          **See also:**

          * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      - $ref: '#/components/parameters/metasysFeature'
      requestBody:
        description: 'The body of a command is defined by the `commandBodySchema`. The

          `commandBodySchema` is a property of every command returned by the

          [List commands](#operation/getObjectCommands) operation.

          '
        required: true
        content:
          application/json:
            examples:
              adjustCommandOnAV:
                summary: Adjust AV
                description: 'This body is used with the adjust command of an Analog Value (AV).

                  It sends the value `72.5` along with an annotation about why the

                  command was invoked. The URL for this command is

                  `/objects/{objectId}/commands/adjustCommand`

                  '
                value:
                  parameters:
                  - 72.5
                  annotation: Increase the set point to make it warmer.
              adjustCommandAVWithPriority:
                summary: Adjust AV with priority
                description: 'This body is used with the adjust command of an Analog Value (AV)

                  at a specific priority (from the `writePriorityEnumSet`). The url

                  for this command is `/objects/{objectId}/commands/adjustCommand`

                  '
                value:
                  parameters:
                  - 69
                  priority: writePriorityEnumSet.priority12
              multistate0Command:
                summary: Send "Multi-state 0" command to MV
                description: 'Multistate (MV) objects support commands that let you set the

                  value to a specific state. The URL for this command is

                  `/objects/{objectId}/commands/multistate0Command`. The body can be

                  an empty object since there are no required properties.

                  '
                value: {}
              multistate1CommandWithPriority:
                summary: Send "Multi-state 1" command to MV with priority
                description: 'Multistate (MV) objects support commands that let you set the

                  value to a specific state. The URL for this command is

                  `/objects/{objectId}/commands/multistate1Command`. The body

                  contains just a priority.

                  '
                value:
                  priority: writePriorityEnumSet.priority12
            schema:
              $ref: '#/components/schemas/put-command-request'
      responses:
        '202':
          description: Accepted
        '400':
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errorMessage'
                - $ref: '#/components/schemas/standardErrorMessage'
          description: 'There are many unique scenarios that can result in a 400.


            - The command body is malformed or missing required properties.

            - The command is not valid for the specified object.


            If you specify `standard-error` in `METASYS-FEATURE` header then the response

            will use the standard error payload else it''ll use the legacy error payload.


            '
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request PUT \\\n  --url https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/commands/adjustCommand \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"parameters\":[72.5],\"annotation\":\"Increase the set point to make it warmer.\"}'"
