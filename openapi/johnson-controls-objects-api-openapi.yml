openapi: 3.2.0
info:
  title: Johnson Controls Objects API
  version: Version 6 for 16.0
  x-logo:
    url: source/images/logo.svg
    href: https://jci-metasys.github.io/
  x-releases:
  - '14.0'
  - '14.1'
  - '15.0'
  - '16.0'
  x-revision: 'Commit ID: 4b227676a'
  description: 'Operations tagged objects across 2 of this provider''s published API definitions: metasys-api-v6-16.json, johnson-controls-metasys-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: Objects
  description: 'This section describes the operations you can perform on objects. Objects are

    self-contained functional items in the Metasys system, for a full definition

    refer to the

    Metasys System Glossary.

    Use objects operations to list, create, edit, and delete objects. Apply filters,

    sorting, and paging to further refine the results. Some operations accept

    subscriptions, see

    Change of Value Subscriptions.


    ## Batch Subscriptions And Async Operations


    ### Change of Value Subscriptions


    Subscribe for change of value (COV) events to receive updates when attribute

    values change. Currently, subscriptions are available for

    Get attribute value operations (individual and

    batch).


    #### Subscribing


    To subscribe for COV events, complete the following steps:


    1. Obtain a stream ID using the workflow outlined in the

    Streaming section.

    2. Use one of the following operations and include a `METASYS-SUBSCRIBE` header

    with the stream ID:

    - Single attribute: Get attribute value

    - Multiple attributes: Batch object operations


    **Note:** Any filters added to the original `GET` operation also apply to the event

    subscription.


    #### Unsubscribing


    To unsubscribe from a COV event, complete the following steps:


    1. Get the `METASYS-SUBSCRIPTION-LOCATION` from the subscribe operation

    response.

    2. Issue a Delete COV subscription request

    to `METASYS-SUBSCRIPTION-LOCATION`.


    **See also:**


    - Get a stream

    - Streaming


    #### Events


    COV Events : There are four event types sent by the COV subscription: heartbeat,

    heartbeatImproved, update, and notification.


    ##### Heartbeat


    `object.values.heartbeat` - A heartbeat event is sent to show that the

    subscription is still alive. A heartbeat is a JSON string with the current UTC

    date time in ISO 8601 format and is sent every 30 seconds.


    ##### Heartbeat Improved


    `object.values.heartbeatImproved` - Similar to `object.values.heartbeat` but

    includes an array of all active subscription ids.


    ##### COV Update


    `object.values.update` - The client receives an update event when an attribute

    value changes. This payload is similar in structure as the payload returned by

    _Get attribute value_, but also includes `id` and `itemReference` of the object

    to provide context for the attribute in question. The overall schema for this

    payload is identical to the _Get an object_ schema (except this payload has no

    `effectivePermissions` property). The payload excludes the `schema` for the

    attribute by default, but it can be optionally included by using the

    `includeSchema` flag on the initial subscription request.


    ##### COV Notification


    `object.values.notification` - A notification event is sent when a value has

    changed but the value is not included in the payload. This happens for some

    values that are not simple scalar values. You can use this event as a trigger to

    reread the attribute. In the example, even though the payload does not include

    the current value, you know which object this is for (based on `id` and

    `itemReference`), and you know it is the `overrideExpirationTime` attribute

    based on the `attribute` property.'
paths:
  /objects:
    get:
      tags:
      - Objects
      summary: List objects
      description: 'Returns the root object of the tree and, optionally, its children. The root

        object is the site object. The default response is a tree representation.

        Set `flatten=true` to flatten the tree into a list representation. The

        number of levels returned depends on the value of the `depth` parameter. To

        get just the root of the tree use a depth of 0. Values of `depth` greater

        than 1 are not allowed on this endpoint.'
      operationId: getObjects
      parameters:
      - name: depth
        in: query
        description: The depth of the tree to return. The provided value is ignored if `pathTo`, `objectType`, or `classification` are specified.
        schema:
          type: integer
          default: 1
          maximum: 1
          minimum: 0
        example: 1
      - $ref: '#/components/parameters/getObjectsFlattenParameter'
      - $ref: '#/components/parameters/getObjectsIncludeExtensionsParameter'
      - name: pathTo
        in: query
        description: 'This parameter causes the response to contain the object specified by

          this parameter, the root object, and the objects in between.


          If this parameter is specified, then `depth` and `includeExtensions` are

          ignored.

          '
        example: a5885077-9dba-5923-a6d8-ae4aabdc6f0a
        schema:
          type: string
      - $ref: '#/components/parameters/getObjectsIncludeEffectivePermissionsParameter'
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/getObjectsResponse'
              examples:
                tree:
                  $ref: '#/components/examples/get-objects-as-tree'
                list:
                  $ref: '#/components/examples/get-objects-as-list'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/objects \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod /objects'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/objects', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    post:
      tags:
      - Objects
      operationId: postObjects
      summary: Create object
      description: 'Creates a new object. Several things are needed to successfully create an

        object. You must know


        - the type of object you want to create

        - if that object type is supported in the location you want to create it

        - what properties can be set on that type of object when creating it

        - what properties are required to be set.


        Find the complete list of object types with the operation

        `GET /schemas/enums/objectTypeEnumSet`. To determine the specific set of

        objects that can be created in a location use _List supported child types_

        (`GET /objects/{objectId}/supportedChildTypes`). To discover what object

        properties can be set and which are required when creating an object use

        _Get a schema for an object type_ (`GET /schemas/objectTypes/{objectType}`)


        **See also:**


        - List objects and

        List child objects to discover the object

        identifier of the parent object.

        - Get enumeration to look up the

        `objectTypeEnumSet` enumeration.

        - List supported child types to

        discover the supported object types for a given parent object.

        - Get a schema for an object type to

        discover the schema of the specific object type.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              av:
                summary: Request body to create an analog value (AV) object
                description: This request body creates a new object of type `objectTypeEnumSet.avClass` under a folder with an identifier of `82b6f2d5-6fed-5074-b611-94dd40028312` with a locally unique identifier of `ZN-3-SETPT`. The properties on the new object are `name`, `description`, `objectCategory`, `minPresValue` and `maxPresValue`.
                value:
                  parentId: 82b6f2d5-6fed-5074-b611-94dd40028312
                  localUniqueIdentifier: ZN-3-SETPT
                  objectType: objectTypeEnumSet.avClass
                  item:
                    name: Zone 3 Setpoint
                    description: Zone 3 Temperature Setpoint
                    objectCategory: objectCategoryEnumSet.hvacCategory
                    minPresValue: 55
                    maxPresValue: 95
              bv:
                summary: Request body to create a binary value (BV) object
                description: This request body creates a new object of type `objectTypeEnumSet.bvClass` under a folder with an identifier of `82b6f2d5-6fed-5074-b611-94dd40028312` with a locally unique identifier of `BV`. The properties being set on the new object are `name` and `statesText`. The `statesText` property defines which enum set (and therefore which labels) are displayed to a user when looking at the states of this BV. In this case the labels (in English) are `Fault` and `OK`.
                value:
                  parentId: 82b6f2d5-6fed-5074-b611-94dd40028312
                  localUniqueIdentifier: BV
                  objectType: objectTypeEnumSet.bvClass
                  item:
                    name: Fault status
                    statesText: twostateEnumSet.faultOkEnumSet
            schema:
              $ref: '#/components/schemas/post-objects-request'
      responses:
        '201':
          description: Success
          headers:
            Location:
              description: The location of the newly created resource.
              schema:
                type: string
                format: uri
              example: https://metasys-server.example.com/api/v6/objects/82b6f2d5-6fed-5074-b611-94dd40028312
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request POST \\\n  --url https://metasys-server.example.com/api/v6/objects \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"parentId\":\"82b6f2d5-6fed-5074-b611-94dd40028312\",\"localUniqueIdentifier\":\"ZN-3-SETPT\",\"objectType\":\"objectTypeEnumSet.avClass\",\"item\":{\"name\":\"Zone 3 Setpoint\",\"description\":\"Zone 3 Temperature Setpoint\",\"objectCategory\":\"objectCategoryEnumSet.hvacCategory\",\"minPresValue\":55,\"maxPresValue\":95}}'"
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .WithHeader(\"Content-Type\", \"application/json\")\n    .PostStringAsync(\"{\\\"parentId\\\":\\\"82b6f2d5-6fed-5074-b611-94dd40028312\\\",\\\"localUniqueIdentifier\\\":\\\"ZN-3-SETPT\\\",\\\"objectType\\\":\\\"objectTypeEnumSet.avClass\\\",\\\"item\\\":{\\\"name\\\":\\\"Zone 3 Setpoint\\\",\\\"description\\\":\\\"Zone 3 Temperature Setpoint\\\",\\\"objectCategory\\\":\\\"objectCategoryEnumSet.hvacCategory\\\",\\\"minPresValue\\\":55,\\\"maxPresValue\\\":95}}\");"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects\" `\n  -Method Post `\n  -Body '{\"parentId\":\"82b6f2d5-6fed-5074-b611-94dd40028312\",\"localUniqueIdentifier\":\"ZN-3-SETPT\",\"objectType\":\"objectTypeEnumSet.avClass\",\"item\":{\"name\":\"Zone 3 Setpoint\",\"description\":\"Zone 3 Temperature Setpoint\",\"objectCategory\":\"objectCategoryEnumSet.hvacCategory\",\"minPresValue\":55,\"maxPresValue\":95}}' `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n    'Content-Type' = 'application/json'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /objects `\n  -Method Post `\n  -Body '{\"parentId\":\"82b6f2d5-6fed-5074-b611-94dd40028312\",\"localUniqueIdentifier\":\"ZN-3-SETPT\",\"objectType\":\"objectTypeEnumSet.avClass\",\"item\":{\"name\":\"Zone 3 Setpoint\",\"description\":\"Zone 3 Temperature Setpoint\",\"objectCategory\":\"objectCategoryEnumSet.hvacCategory\",\"minPresValue\":55,\"maxPresValue\":95}}'"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.post(\n  '/objects',\n  '{\"parentId\":\"82b6f2d5-6fed-5074-b611-94dd40028312\",\"localUniqueIdentifier\":\"ZN-3-SETPT\",\"objectType\":\"objectTypeEnumSet.avClass\",\"item\":{\"name\":\"Zone 3 Setpoint\",\"description\":\"Zone 3 Temperature Setpoint\",\"objectCategory\":\"objectCategoryEnumSet.hvacCategory\",\"minPresValue\":55,\"maxPresValue\":95}}', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\" ,\n    \"Content-Type\": \"application/json\"\n}\npayload = \"{\\\"parentId\\\":\\\"82b6f2d5-6fed-5074-b611-94dd40028312\\\",\\\"localUniqueIdentifier\\\":\\\"ZN-3-SETPT\\\",\\\"objectType\\\":\\\"objectTypeEnumSet.avClass\\\",\\\"item\\\":{\\\"name\\\":\\\"Zone 3 Setpoint\\\",\\\"description\\\":\\\"Zone 3 Temperature Setpoint\\\",\\\"objectCategory\\\":\\\"objectCategoryEnumSet.hvacCategory\\\",\\\"minPresValue\\\":55,\\\"maxPresValue\\\":95}}\"\n\nconn.request(\"POST\", url, payload, headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .header(\"content-type\", \"application/json\")\n    .method(\"POST\", HttpRequest.BodyPublishers.ofString(\"{\\\"parentId\\\":\\\"82b6f2d5-6fed-5074-b611-94dd40028312\\\",\\\"localUniqueIdentifier\\\":\\\"ZN-3-SETPT\\\",\\\"objectType\\\":\\\"objectTypeEnumSet.avClass\\\",\\\"item\\\":{\\\"name\\\":\\\"Zone 3 Setpoint\\\",\\\"description\\\":\\\"Zone 3 Temperature Setpoint\\\",\\\"objectCategory\\\":\\\"objectCategoryEnumSet.hvacCategory\\\",\\\"minPresValue\\\":55,\\\"maxPresValue\\\":95}}\"))\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /objects/{objectId}/objects:
    get:
      tags:
      - Objects
      summary: List child objects
      description: 'Returns the specified object and optionally one or more levels of the tree

        under the object. The default response is a tree representation. Set

        `flatten=true` to flatten the tree into a list representation.'
      operationId: getChildObjects
      parameters:
      - name: objectId
        in: path
        description: Specifies the root of the subtree to return for this request. The `objectId` is the identifier of the object to retrieve (optionally along with 1 or more levels of descendants).
        required: true
        example: 767d8af0-163f-552c-ba37-a884466075f9
        schema:
          type: string
      - name: depth
        in: query
        description: 'The depth of the tree to return. For typical usage, a value or 1 or 2 is

          recommended. Use `-1` for maximum depth.


          The provided value is ignored if `pathTo`, `objectType`, or

          `classification` are specified.

          '
        schema:
          type: integer
          default: 1
          minimum: -1
        example: 1
      - $ref: '#/components/parameters/getObjectsFlattenParameter'
      - $ref: '#/components/parameters/getObjectsIncludeExtensionsParameter'
      - name: pathTo
        in: query
        description: 'This parameter filters the response down to just containing the object

          specified by this parameter, the object specified by `objectId` in the

          path, and the objects in between.


          If this parameter is specified, then `depth`, `includeExtensions`,

          `objectType` and `classification` are ignored.

          '
        example: a5885077-9dba-5923-a6d8-ae4aabdc6f0a
        schema:
          type: string
      - name: objectType
        in: query
        x-metasysType: enum
        x-metasysEnum: objectTypeEnumSet
        description: 'Type of objects to include in the response. This parameter may be

          repeated. To search for all AV and AI objects one would specify

          `/objects?objectType=avClass&objectType=aiClass`.


          The use of this parameter overrides `depth` to `-1` and

          `includeExtensions` to `true`.


          It is an error to specify this parameter if `classification` is

          specified.


          The response will include the specified object, the objects that match

          the `objectType` for the given `depth` and any objects in between (like

          folders and devices).



          The acceptable values for the elements of this parameter come from the `objectTypeEnumSet` enumeration.

          It is acceptable to use the short name of the object type (for example, `avClass` instead of `objectTypeEnumSet.avClass`) because the enumeration set is known from context.

          Find the definition of `objectTypeEnumSet` at the relative URL of `/schemas/enums/objectTypeEnumSet`.


          **See also:**

          * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
        schema:
          type: array
          items:
            type: string
        examples:
          av:
            summary: Analog Value Object Type
            value:
            - avClass
          bv:
            summary: Binary Value Object Type
            value:
            - bvClass
          mv:
            summary: Multiple Value Object Type
            value:
            - mvClass
          multiple:
            summary: Multiple Types
            value:
            - avClass
            - bvClass
      - name: classification
        in: query
        description: Filter objects to those with the specific classification. The use of this parameter overrides `depth` to `-1` and `includeExtensions` to `true`. It is an error to specify this parameter if `objectType` is specified.
        examples:
          object:
            summary: Any object not classified by one of the other classification values
            value:
            - object
          device:
            summary: An object that represents a supervisory controller
            value:
            - device
          controller:
            summary: An object that represents a field controller
            value:
            - controller
          pointsAndObjects:
            summary: Points and Objects
            value:
            - object
            - point
        schema:
          type: array
          items:
            type: string
            enum:
            - object
            - device
            - integration
            - controller
            - point
            - site
            - navList
            - extension
            - folder
            - reference
            - server
            - archive
      - $ref: '#/components/parameters/getObjectsIncludeEffectivePermissionsParameter'
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/getObjectsResponse'
              examples:
                tree:
                  $ref: '#/components/examples/get-objects-as-tree'
                list:
                  $ref: '#/components/examples/get-objects-as-list'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/objects/767d8af0-163f-552c-ba37-a884466075f9/objects \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects/767d8af0-163f-552c-ba37-a884466075f9/objects\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects/767d8af0-163f-552c-ba37-a884466075f9/objects\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod /objects/767d8af0-163f-552c-ba37-a884466075f9/objects'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/objects/767d8af0-163f-552c-ba37-a884466075f9/objects', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects/767d8af0-163f-552c-ba37-a884466075f9/objects\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects/767d8af0-163f-552c-ba37-a884466075f9/objects\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /objectIdentifiers:
    get:
      tags:
      - Objects
      summary: Get object id
      deprecated: true
      description: 'Use Lookup object identifier instead.


        Finds the object identifier (the `id` property of an object) for the object

        with the specified fully qualified reference (`fqr`).'
      operationId: getObjectIdentifier
      parameters:
      - name: fqr
        in: query
        required: true
        examples:
          siteDirector:
            summary: An example of a site director fqr
            value: adx:adx
          av:
            summary: An example of an analog value object fqr
            value: adx:nae23/Programming.AV1
        schema:
          type: string
          x-format: fully-qualified-reference
        description: 'The fully qualified reference of an object. It refers to an object''s

          `itemReference` property.


          Fully qualified references use characters that must be escaped when used as

          query parameters. Most HTTP libraries do this for you automatically. However, if

          you are using `curl` or PowerShell where you specify the full URL yourself you

          may need to be aware. For example, here is the URL to use with `curl` for a

          reference of `oas:oas/Programming.AV3`:

          `https://metasys-server.example.com/api/v6/objectIdentifiers?fqr=oas%3Aoas%2FProgramming.AV3`


          '
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                type: string
                description: The identifier of an object
              example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url 'https://metasys-server.example.com/api/v6/objectIdentifiers?fqr=adx%3Aadx' \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
