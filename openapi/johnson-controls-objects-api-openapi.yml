  /objects/{objectId}/commands:
    get:
      tags:
      - Objects
      summary: List commands
      description: 'Returns a payload that lists all of the commands that an object supports.

        Each command entry has an `invokeUrl` property, which is the URL needed to

        invoke the command. In addition, each command entry has a

        `commandBodySchema` property, which is a JSON schema that describes the

        acceptable payload for the command. Commands are invoked using the HTTP

        method `PUT` along with the `invokeUrl` and acceptable body.


        **Note:** Some objects, such as multi-state values (MV) and binary values (BV),

        may list a command that has a `commandSet` property and a property named

        `aggregateCommand` with a value of `true` instead of `invokeUrl`. This

        `commandSet` lists one or more commands. This entry is not a true command

        but rather provides a hint to graphical user interfaces on how they may want

        to group the commands of the `commandSet` under one command name. For

        example, an `MV` object lists a command with the identifier

        `commandIdEnumSet.adjustCommand`. This is not an actual command on an `MV`.

        Instead the actual commands that could be used to present this command in a

        UI are listed in the `commandSet` and they have identifiers like

        `commandIdEnumSet.multistate0Command`. The Metasys User Interface displays

        all of these commands as a single adjust command with the titles of the

        individual commands as the parameter to send.


        **Licensing Restrictions**


        Requires Monitoring and Commanding API license.'
      operationId: getObjectCommands
      parameters:
      - $ref: '#/components/parameters/objectId'
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              examples:
                av:
                  $ref: '#/components/examples/get-commands-av'
                mv:
                  $ref: '#/components/examples/get-commands-mv'
                oasDeviceObject:
                  $ref: '#/components/examples/get-commands-oas'
              schema:
                type: object
                required:
                - self
                - items
                - effectivePermissions
                additionalProperties: false
                properties:
                  self:
                    type: string
                    description: A link to this collection.
                    format: uri
                    readOnly: true
                  items:
                    type: array
                    description: 'The list of commands.

                      '
                    items:
                      oneOf:
                      - type: object
                        title: Command Entry
                        description: A command description.
                        required:
                        - id
                        - invokeUrl
                        - commandBodySchema
                        additionalProperties: false
                        properties:
                          id:
                            type: string
                            example: commandIdEnumSet.adjustCommand
                            description: 'The command identifier


                              The values for this property come from the `commandIdEnumSet` enumeration.

                              Find the definition of `commandIdEnumSet` at the relative URL of `/schemas/enums/commandIdEnumSet`.


                              **See also:**

                              * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
                            x-metasysType: enum
                            x-metasysEnum: commandIdEnumSet
                          invokeUrl:
                            type: string
                            format: uri
                            description: 'The URL used to invoke this command. Commands are

                              always invoked with a `PUT` method.

                              '
                          commandBodySchema:
                            type: object
                            description: 'Describes acceptable payloads for this command.

                              While the schemas for commands vary they share some

                              things in common. A command payload is always a JSON

                              object. Typical properties include `parameters`,

                              `priority` and `annotation`.


                              If `parameters` is present, it will provide a list

                              of the parameters necessary to invoke the command

                              (along with their types). The `parameters` property

                              is always an array (even if it is empty or only has

                              one parameter).


                              If `priority` is present, it will allow a command to

                              be sent at a certain priority. Acceptable values for

                              this property come from the `writePriorityEnumSet`

                              enumeration.


                              If `annotation` is present, it will allow a note to

                              be attached to the invocation of this command and

                              this note will be visible in the system (attached to

                              audits, for example).

                              '
                          title:
                            type: string
                            description: Translated name of this command.
                          aggregateCommand:
                            description: Will always be missing or set to `false`.
                            type: boolean
                            enum:
                            - false
                      - type: object
                        title: Aggregate Command Set
