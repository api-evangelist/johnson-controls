      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.put(\n  '/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/commands/adjustCommand',\n  '{\"parameters\":[72.5],\"annotation\":\"Increase the set point to make it warmer.\"}', {\n  headers\n});"
      - lang: python
        label: Python
