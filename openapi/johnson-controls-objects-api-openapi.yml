      summary: Get an object
      description: 'Objects support one or more views. By default, this operation gets the

        default view of an object. For many objects this is the Focus View

        (identifier `viewNameEnumSet.focusView`). To see the list of views an object

        supports see List Views (`/objects/{objectId}/views`). To get a different

        view of an object specify a value for the `viewId` parameter.


        **Licensing Restrictions**


        Requires Monitoring and Commanding API license.


        **See also:**


        - List Views for information on retrieving the

        view collection of an object.'
      operationId: getObject
      parameters:
      - $ref: '#/components/parameters/objectId'
      - name: viewId
        in: query
        description: 'The view to retrieve.


          This parameter is optional and if it is not specified the default view

          for the object will be returned. For many objects this is the Focus view

          (`focusView`).



          The acceptable values for this parameter come from the `viewNameEnumSet` enumeration.

          It is acceptable to use the short name of the view (for example, `focusView` instead of `viewNameEnumSet.focusView`) because the enumeration set is known from context.

          Find the definition of `viewNameEnumSet` at the relative URL of `/schemas/enums/viewNameEnumSet`.


          **See also:**

          * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
