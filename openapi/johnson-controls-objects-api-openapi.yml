        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /objects/batch:
    post:
      tags:
      - Objects
      summary: Batch operations
      operationId: postObjectsBatch
      parameters:
      - $ref: '#/components/parameters/metasysSubscribe'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batch-read:
                summary: Read multiple attributes
                description: 'This example shows a request body that will read the

                  `presentValue` and `status` from 3 different objects using

                  sequential numbers as request identifiers.


                  This example shows the use of sequential numeric values used as

                  request identifiers but any unique strings can be used.

                  '
                value:
                  method: GET
                  requests:
                  - id: '1'
                    relativeUrl: 960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue
                  - id: '2'
                    relativeUrl: 960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status
                  - id: '3'
                    relativeUrl: c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue
                  - id: '4'
                    relativeUrl: c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status
                  - id: '5'
                    relativeUrl: 3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue
                  - id: '6'
                    relativeUrl: 3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status
            schema:
              type: object
              example:
                method: GET
                requests:
                - id: '1'
                  relativeUrl: 960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue
                - id: '2'
                  relativeUrl: 960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status
                - id: '3'
                  relativeUrl: c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue
                - id: '4'
                  relativeUrl: c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status
                - id: '5'
                  relativeUrl: 3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue
                - id: '6'
                  relativeUrl: 3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status
              required:
              - method
              - requests
              properties:
                method:
                  type: string
                  enum:
                  - GET
                  - PATCH
                  - PUT
                  description: 'The HTTP method to use for each request. This property is restricted to `GET`

                    for this version of the API since _Get attribute value_ is the only operation

                    supported in a batch.


                    '
                requests:
                  type: array
                  description: A collection of entries that represent the operations to invoke.
                  minItems: 1
                  items:
                    type: object
                    required:
                    - id
                    - relativeUrl
                    properties:
                      id:
                        type: string
                        description: A client supplied unique identifier for this request. The `id` values supplied by the client will be used to uniquely identify the responses that correspond to each request.
                      relativeUrl:
                        type: string
                        format: uri-reference
                        description: A relative path (with respect to `/objects`) that identifies a resource for one of the supported operations.
                      body:
                        type: object
                        description: 'The body for the request. This property is only used when

                          the operation accepts/requires a body.


                          <!-- visibility:internal -->


                          (INTERNAL) The `body` is required for _Modify objects_ and

                          _Send commands_.


                          <!-- visibility:public -->


                          When used the `body` should conform to the request body

                          schema of the command being invoked.

                          '
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                type: object
                readOnly: true
                required:
                - responses
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - status
                      - body
                      properties:
                        id:
                          type: string
                          description: One of the client supplied unique request identifiers in the request. This identifier is used to match the response to the correct operation in the request.
                        status:
                          type: integer
                          description: The HTTP Status code returned for the corresponding operation.
                        body:
                          description: The response body for the corresponding operation.
                          oneOf:
                          - $ref: '#/components/schemas/get-object-attribute-response'
                          - type: object
                            title: Error response
                            required:
                            - error
                            additionalProperties: false
                            properties:
                              error:
                                type: object
                                additionalProperties: true
                                properties:
                                  statusName:
                                    type: string
                                    description: 'A Metasys specific status code. The format

                                      of this code is variable. If the value is

                                      _unqualified_ ({enumValue}, e.g.

                                      "attributeNotFound"), then the display text

                                      associated to the code comes from the

                                      `statusEnumSet` available at

                                      `/schemas/enums/statusEnumSet`. If the value

                                      is qualified with just an enumeration

                                      ("{enumeration}.{member}", e.g.

                                      "statusEnumSet.attributeNotFound"), then the

                                      display text comes from the enumeration

                                      schema available at

                                      `/schemas/enums/{enumeration}`. If the value

                                      is qualified with a namespace

                                      ("{namespace}:{enumeration}.{member}", e.g.

                                      "api.diagram:error.saveFailed"), then the

                                      display text is the responsibility of the

                                      client.

                                      '
                                  message:
                                    type: string
                                    description: The display string message that correlates to `statusName`.
                                  details:
                                    oneOf:
                                    - type: string
                                    - type: object
                                    description: Additional details about the error.
                          - type:
                            - string
                            - 'null'
                            enum:
                            - null
                            title: No content
                            description: When there is no response payload then the body will be `null`.
                          - type: object
                            required:
                            - JobId
                            properties:
                              JobId:
                                type: string
                          - $ref: '#/components/schemas/lookup-object-identifier-response'
                          - $ref: '#/components/schemas/lookup-object-identifier-error-response'
              examples:
                batch-read:
                  summary: Response to read multiple attributes
                  description: 'This example shows the response to a read multiple attributes

                    request. Each operation response is uniquely identified by the

                    corresponding identifier (`id`) from the request.

                    '
                  value:
                    responses:
                    - id: '1'
                      status: 200
                      body:
                        item:
                          presentValue: 78.5
                        condition:
                          presentValue:
                            priority: writePriorityEnumSet.priorityDefault
                    - id: '2'
                      status: 200
                      body:
                        item:
                          status: objectStatusEnumSet.osNormal
                        condition: {}
                    - id: '3'
                      status: 200
                      body:
                        item:
                          presentValue: 50
                        condition:
                          presentValue:
                            priority: writePriorityEnumSet.priorityDefault
                    - id: '4'
                      status: 200
                      body:
                        item:
                          status: objectStatusEnumSet.osLowAlarm
                        condition: {}
                    - id: '5'
                      status: 200
                      body:
                        item:
                          presentValue: 78.5
                        condition:
                          presentValue:
                            priority: writePriorityEnumSet.priorityDefault
                    - id: '6'
                      status: 200
                      body:
                        item:
                          status: objectStatusEnumSet.osNormal
                        condition: {}
                batch-read-async:
                  summary: Response to read multiple attributes with subscription
                  description: 'This example shows the response to a read multiple attributes

                    request that was sent with a `METASYS-SUBSCRIBE` header. Each

                    individual response will have a status of `202` if the

                    corresponding operation was accepted.

                    '
                  value:
                    responses:
                    - id: '1'
                      status: 202
                      body: null
                    - id: '2'
                      status: 202
                      body: null
                    - id: '3'
                      status: 202
                      body: null
                batch-read-async-with-errors:
                  summary: Response to read multiple attributes with errors returned
                  description: 'This example shows the response to a read multiple attributes

                    request that was sent with a `METASYS-SUBSCRIBE` header. One of

                    the operations returned with a status a `404` to indicate an

                    issue with the request. The other operation returns a status of

                    `202` signifying it was accepted.

                    '
                  value:
                    responses:
                    - id: B
                      status: 404
                      body:
                        error:
                          statusName: attributeNotFound
                          message: Invalid Attribute number for this object
                          details: (states) was not found in enum set (attributeEnumSet)
                    - id: A
                      status: 202
                      body: null
          headers:
            METASYS-SUBSCRIPTION-LOCATION:
              description: 'This header is included in the HTTP response of operations that execute

                asynchronously. The last path parameter in this header is a subscription id

                (for example, `538f00be-5788-4f68-a60e-45a14356c7ef` in the example URL). As

                the operation executes, one or more events will be sent over the stream. All

                events that are a result of this operation will include this subscription

                id. The subscription will be automatically closed when the operation

                completes.


                **Note:** If you include an invalid `METASYS_SUBSCRIBE` header you will not be

                given any error, nor will you receive any updates.

                '
              schema:
                type: string
                format: uri
              example: https://metasys-server.example.com/api/v6/objects/streams/72d4ee80-e324-4922-b0ec-1425079d892a/subscriptions/538f00be-5788-4f68-a60e-45a14356c7ef
              required: false
            METASYS-CALL-ASYNC-LOCATION:
              x-visibility: private
              description: 'This header is included in the HTTP response of operations that execute

                asynchronously. The last path parameter in this header is a subscription id

                (for example, `538f00be-5788-4f68-a60e-45a14356c7ef` in the example URL). As

                the operation executes, one or more events will be sent over the stream. All

                events that are a result of this operation will include this subscription

                id. The subscription will be automatically closed when the operation

                completes.


                **Note:** If you include an invalid `METASYS-CALL-ASYNC` header you will not be

                given any error, nor will you receive any updates.

                '
              schema:
                type: string
                format: uri
              example: https://metasys-server.example.com/api/v6/objects/streams/72d4ee80-e324-4922-b0ec-1425079d892a/subscriptions/538f00be-5788-4f68-a60e-45a14356c7ef
              required: false
        '400':
          description: "There are many unique scenarios that can result in a 400.\n\n- Create objects request is not valid.\n- The transaction id that is supplied in the transaction token does not\n  exist or has expired.\n- The signature reason and/or annotation in the transaction token are\n  missing but required.\n- A transaction token is supplied and the original request doesn't match\n  the new request.\n"
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/errorMessage'
              examples:
                readAttributeBadRequestDuplicateIds:
                  summary: Read attribute bad request with duplicate IDs
                  description: "The request included the same `id` multiple times as in the\nfollowing example.\n\n<details><summary>Click to see the bad request</summary>\n\n```json\n{\n  \"method\": \"GET\",\n  \"requests\": [\n    {\n      \"id\": \"1\",\n      \"relativeUrl\": \"5437f1d4-4f83-5ace-be32-ebe0d962c658/attributes/presentValue\"\n    },\n    {\n      \"id\": \"1\",\n      \"relativeUrl\": \"cdf01d02-c426-5cc5-8944-61df1b1c0398/attributes/presentValue\"\n    }\n  ]\n}\n```\n\n</details>\n"
                  value:
                    message: The batched request contains duplicate request IDs.
      description: 'This operation is used to invoke multiple operations in a single HTTP request.

        Often a batch request is more efficient than sending each individual operation

        in its own HTTP request.


        In this version of the API, the only objects related operation that can be used

        in a batch is _Get attribute value_.


        If this operation is invoked with a valid `METASYS-SUBSCRIBE` header it will

        cause a subscription to be created for the attributes in the request and rather

        than returning any values, the current values and any updates to the attributes

        will be sent over the specified stream.


        **Licensing Restrictions**


        Requires Monitoring and Commanding API license.


        **See also:**


        - Get attribute value

        - Get a stream

        - Change of value subscriptions

        - Lookup object identifier'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request POST \\\n  --url https://metasys-server.example.com/api/v6/objects/batch \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"method\":\"GET\",\"requests\":[{\"id\":\"1\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\"},{\"id\":\"2\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\"},{\"id\":\"3\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\"},{\"id\":\"4\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\"},{\"id\":\"5\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\"},{\"id\":\"6\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\"}]}'"
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects/batch\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .WithHeader(\"Content-Type\", \"application/json\")\n    .PostStringAsync(\"{\\\"method\\\":\\\"GET\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\\\"},{\\\"id\\\":\\\"2\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\\\"},{\\\"id\\\":\\\"3\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\\\"},{\\\"id\\\":\\\"4\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\\\"},{\\\"id\\\":\\\"5\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\\\"},{\\\"id\\\":\\\"6\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\\\"}]}\");"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects/batch\" `\n  -Method Post `\n  -Body '{\"method\":\"GET\",\"requests\":[{\"id\":\"1\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\"},{\"id\":\"2\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\"},{\"id\":\"3\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\"},{\"id\":\"4\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\"},{\"id\":\"5\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\"},{\"id\":\"6\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\"}]}' `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n    'Content-Type' = 'application/json'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /objects/batch `\n  -Method Post `\n  -Body '{\"method\":\"GET\",\"requests\":[{\"id\":\"1\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\"},{\"id\":\"2\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\"},{\"id\":\"3\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\"},{\"id\":\"4\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\"},{\"id\":\"5\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\"},{\"id\":\"6\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\"}]}'"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.post(\n  '/objects/batch',\n  '{\"method\":\"GET\",\"requests\":[{\"id\":\"1\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\"},{\"id\":\"2\",\"relativeUrl\":\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\"},{\"id\":\"3\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\"},{\"id\":\"4\",\"relativeUrl\":\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\"},{\"id\":\"5\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\"},{\"id\":\"6\",\"relativeUrl\":\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\"}]}', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects/batch\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\" ,\n    \"Content-Type\": \"application/json\"\n}\npayload = \"{\\\"method\\\":\\\"GET\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\\\"},{\\\"id\\\":\\\"2\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\\\"},{\\\"id\\\":\\\"3\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\\\"},{\\\"id\\\":\\\"4\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\\\"},{\\\"id\\\":\\\"5\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\\\"},{\\\"id\\\":\\\"6\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\\\"}]}\"\n\nconn.request(\"POST\", url, payload, headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects/batch\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .header(\"content-type\", \"application/json\")\n    .method(\"POST\", HttpRequest.BodyPublishers.ofString(\"{\\\"method\\\":\\\"GET\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/presentValue\\\"},{\\\"id\\\":\\\"2\\\",\\\"relativeUrl\\\":\\\"960534d2-7df5-5ed8-884c-164e7a2f280a/attributes/status\\\"},{\\\"id\\\":\\\"3\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/presentValue\\\"},{\\\"id\\\":\\\"4\\\",\\\"relativeUrl\\\":\\\"c82d160b-884c-5eac-bad4-89754f0069e0/attributes/status\\\"},{\\\"id\\\":\\\"5\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/presentValue\\\"},{\\\"id\\\":\\\"6\\\",\\\"relativeUrl\\\":\\\"3abd9027-c572-5f6d-9de6-bfc044f899dc/attributes/status\\\"}]}\"))\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
