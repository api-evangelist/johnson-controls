            have a folder with an `itemReference` of `adx:oas/Programming`. Then you

            create an AV with a local unique identifier of `ZN-3-T` within that

            folder. The newly created object will have an `itemReference` of

            `adx:oas/Programming.ZN-3-T`.


            The value must not contain any control characters or any of the following

            characters: `" # '' * , . / : < > ? @ [ \ ] |`

            '
          pattern: ^[^\x00-\x1F\x7F\x22#'*,.\/:<>?@\[\\\]|]+$
        objectType:
          type: string
          x-metasysType: enum
          x-metasysEnum: objectTypeEnumSet
          description: 'The type of object to create.


            The values for this property come from the `objectTypeEnumSet` enumeration.

            Find the definition of `objectTypeEnumSet` at the relative URL of `/schemas/enums/objectTypeEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
        item:
          type: object
          description: 'The `item` object is where you set the properties of the newly created

            object. Which properties can be set and their data types can be discovered

            by using the _Get schema for object type_ operation.


            This property may or may not be required depending on the object you are

            creating. Some objects have defaults for all properties and require

            nothing to be set when creating them. Others have required properties that

            must be set at creation time.

            '
      example:
        parentId: 82b6f2d5-6fed-5074-b611-94dd40028312
        localUniqueIdentifier: ZN-3-SETPT
        objectType: objectTypeEnumSet.avClass
        item:
          name: Zone 3 Setpoint
          description: Zone 3 Temperature Setpoint
          objectCategory: objectCategoryEnumSet.hvacCategory
          minPresValue: 55
          maxPresValue: 95
