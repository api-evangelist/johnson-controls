    patch:
      tags:
      - Objects
      summary: Edit an object
      description: 'This operation modifies one or more attributes of an object. **Note:**

        attributes must be updated in whole. For example, if you wish to modify an

        attribute of `metasysType` `struct` which is modelled as a JSON `object` you

        must include all elements of the struct. It is undefined what might happen

        if you do not. The write could fail, the non-mentioned members may get their

        default value or something else. This applies to any attribute that has a

        JSON type of `array` or `object`. The entire attribute value must be written

        even if you only wish to change one part of the value.


        The request body contains an `item` property which contains one or more

        properties and their new values.


        The attributes of an object (and their schemas) can be discovered by looking

        at the different views of an object or by requesting all of the attributes.


        **Licensing Restrictions**


        Requires Monitoring and Commanding API license.


        **See also:**


        - Get an object

        - List object views

        - List object attributes'
      operationId: patchObject
      parameters:
      - $ref: '#/components/parameters/objectId'
      requestBody:
        required: true
        content:
          application/json:
            examples:
              editPresentValue:
                summary: Edit Present Value attribute of an AV
                value:
                  item:
                    presentValue: 71.5
              editNameAndDescription:
                summary: Edit Name and description
                value:
                  item:
                    name: ZN-T
                    description: Zone Temperature
            schema:
              type: object
              properties:
                item:
                  type: object
                  description: 'The attributes to update.

                    '
              example:
                item:
                  presentValue: 71.5
      responses:
        '200':
          description: Success
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request PATCH \\\n  --url https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"item\":{\"presentValue\":71.5}}'"
