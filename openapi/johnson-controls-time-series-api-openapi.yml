openapi: 3.2.0
info:
  title: Johnson Controls time series API
  version: Version 6 for 16.0
  x-logo:
    url: source/images/logo.svg
    href: https://jci-metasys.github.io/
  x-releases:
  - '14.0'
  - '14.1'
  - '15.0'
  - '16.0'
  x-revision: 'Commit ID: 4b227676a'
  description: 'Operations tagged time series across 2 of this provider''s published API definitions: metasys-api-v6-16.json, johnson-controls-metasys-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: time series
  description: 'This section describes the operations you can perform on time series sample

    data.


    ### Origin of Time Series data


    The Metasys system has two locations from which time series samples can be

    retrieved. The first is from the _trend_ or _log_ object, itself. Each object on

    the Metasys site whose responsibility is to generate samples will have its own

    _buffer_ to store them. When samples are retrieved from the `objects` endpoints,

    they will be retrieved from their respective buffers. Time series operations

    that work with a buffer will include "(buffer)" in their summary.


    The second location is from the _repository_. As samples are collected in the

    _trend_ or _log_ objects themselves, those objects (if configured and enabled)

    have the ability to forward that information to a _repository_. The _repository_

    is the location on the LAN (Local Area Network) that can receive and store

    historical data from one to many Metasys sources. Samples retrieved from the

    `timeSeries` endpoint are retrieved from the particular Metasys device''s

    repository. Time series operations that work with the repository will include

    "(repository)" in their summary.


    ## Subscription Streaming Events


    Clients may subscribe to Objects and Network Devices streaming events. A

    subscription is established by providing a `METASYS-SUBSCRIBE` header on a `GET`

    operation of the `samples` resource under either the `objects` resource paths.


    ### Events


    The following events (with accompanying examples) are available for samples:


    - `timeSeries.subscription.established` - Indicates when a subscription has been

    established for `objects` samples.


    - `timeSeries.subscription.cancelled` - Indicates when a subscription has been

    cancelled for `objects` samples.


    - `timeSeries.error` - Indicates an error occurred with regards to an active

    samples subscription.


    - `timeSeries.samples.update` - Indicates new samples have been generated.

    Sample updates from multiple objects and attributes can be contained in a

    single event (each designated by their `sampledByObjectId`, `sampledObjectId`

    and `attribute` properties).


    - `timeSeries.heartbeat` - Indicates that time series subscription(s) are still

    alive.


    ## Metasys-Call-Async Streaming Events


    Clients may subscribe to Objects Samples Response streaming events. A

    subscription is established by providing a `METASYS-CALL-ASYNC` header on a

    `GET` operation of the `samples` resource under either the `objects` resource

    paths or `POST` operation of the `samples` resource under batch operation of

    times buffer. The following events (with accompanying examples) are available

    for samples:


    ### Samples Events


    The following events (with accompanying examples) are available for async

    samples:


    - `timeSeries.samples.stream.started` - Indicates when a subscription has been

    established for `objects` samples response.


    - `timeSeries.samples.stream.error` - Indicates an error occurred with regards

    to an active samples response subscription.


    - `timeSeries.samples.stream.data` - Indicates samples responses for each

    request. Samples from multiple objects and attributes can be contained in a

    single event (each designated by their `sampledByObjectId`, `sampledObjectId`

    and `attribute` properties).


    - `timeSeries.samples.stream.completed` - Indicates that a streaming samples

    response has completed successfully.'
paths:
  /timeSeries:
    get:
      tags:
      - time series
      summary: List all time series (repository)
      description: 'The operation retrieves a collection of resources for which historical

        time series data exists. This operation uses the time series repository as

        its source of truth. It may contain data for objects that no longer

        actually exist on the site. This operation never considers time series

        that exist exclusively in buffers on devices and that are not configured

        to forward their samples to the repository.'
      operationId: getTimeSeries
      parameters:
      - name: searchString
        in: query
        required: false
        schema:
          type: string
        description: Filter results by finding objects with an `itemReference` that contains the `searchString` as a substring.
        examples:
          av:
            summary: Find all references with `AV`` in them
            value: AV
          programming:
            summary: Find all references with `Programming`` in them
            value: Programming
      - $ref: '#/components/parameters/page'
      - name: pageSize
        in: query
        description: The maximum number of items to return in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 100
        example: 100
      - name: sort
        in: query
        description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
        schema:
          type: string
          default: itemReference
          enum:
          - itemReference
          - -itemReference
        example: itemReference
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                title: Historical Time Series List
                type: object
                required:
                - self
                - total
                - next
                - previous
                - items
                readOnly: true
                properties:
                  self:
                    $ref: '#/components/schemas/schemas_self'
                  total:
                    type: integer
                    description: The total number of items in the collection.
                  next:
                    type:
                    - string
                    - 'null'
                    description: A link to the next page of results.
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    description: A link to the previous page of results.
                    format: uri
                  items:
                    title: Historical Time Series Record
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - itemReference
                      - sampledAttributes
                      properties:
                        id:
                          type: string
                          description: The unique identifier of an object with samples.
                          example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
                        itemReference:
                          type: string
                          format: fully-qualified-reference
                          description: The fully qualified reference of the object.
                        name:
                          type: string
                          description: The name of the object.
                        sampledAttributes:
                          type: array
                          description: The set of attributes for which samples exist.
                          items:
                            title: Sampled Attributes
                            type: object
                            required:
                            - samplesUrl
                            - attribute
                            properties:
                              samplesUrl:
                                type: string
                                format: uri
                                description: The base URL to use for fetching samples of this attribute.
                              attribute:
                                type: string
                                description: 'The attribute for which samples exist.


                                  The values for this property come from the `attributeEnumSet` enumeration.

                                  Find the definition of `attributeEnumSet` at the relative URL of `/schemas/enums/attributeEnumSet`.


                                  **See also:**

                                  * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
                                x-metasysEnum: attributeEnumSet
              examples:
                typical-response:
                  $ref: '#/components/examples/get-time-series-response'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/timeSeries \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/timeSeries\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/timeSeries\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod /timeSeries'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/timeSeries', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/timeSeries\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/timeSeries\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
