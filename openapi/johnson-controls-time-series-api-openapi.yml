  /objects/{objectId}/trendedAttributes/{attributeId}/samples:
    get:
      tags:
      - time series
      summary: Get attribute samples (buffer)
      description: 'Retrieves a collection of samples from the object''s local sample buffer

        for the specified object attribute during a particular date and time

        range.


