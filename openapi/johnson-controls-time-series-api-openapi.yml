  parameters:
    attributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
      x-metasysType: enum
      x-metasysEnum: attributeEnumSet
      description: 'The identifier of the attribute.


        The acceptable values for this parameter come from the `attributeEnumSet` enumeration.

        It is acceptable to use the short name of the attribute (for example, `presentValue` instead of `attributeEnumSet.presentValue`) because the enumeration set is known from context.

        Find the definition of `attributeEnumSet` at the relative URL of `/schemas/enums/attributeEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      example: presentValue
    page:
      name: page
      in: query
      description: The page number of items to return.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    objectId:
      name: objectId
      in: path
      description: The identifier of the object.
      example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
      required: true
      schema:
        type: string
    sampledById:
      name: sampledById
      in: query
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
      description: 'Filter samples by objects by supplying one or more `sampledById` values.


        An attribute may have multiple objects sampling it. Use this parameter to

        include samples only from a specific object or set of objects. If no value

        is given for this parameter, then the response will contain samples from all

        of the objects sampling this attribute.

        '
      examples:
        multipleIds:
          summary: Multiple identifiers
          value:
          - 4cc1cb52-b2db-4129-ac93-0d4a5e6dd6d7
          - 4ffd6456-3d36-5e08-8efb-ba91d4a81126
        singleId:
          summary: Single identifier
          value:
          - 4ffd6456-3d36-5e08-8efb-ba91d4a81126
    metasysSubscribe:
      name: METASYS-SUBSCRIBE
      in: header
      description: 'If present, subscribes the client for streaming events associated with the

        resource. The value of this header is a stream id obtained by opening a

        stream with _Get a stream_. The response will have a

        `METASYS-SUBSCRIPTION-LOCATION` header which identifies the created

        subscription.


        **See also:**


        - [Get a stream](#operation/getStream)

        '
      required: false
      schema:
        type: string
      example: 40e47e37-0f24-4101-8e1d-de96af4b648b
    streamId:
      name: streamId
      in: path
      required: true
      description: 'The stream identifier that contains the subscription. This is the unique

        identifier for the client''s stream obtained via `GET /stream`.

        '
      schema:
        type: string
      example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: 'The identifier of the subscription to act upon. This is the unique

        identifier to the subscription for a specific resource or type of event.

        This value is found as the last parameter of a

        `METASYS-SUBSCRIPTION-LOCATION` header returned for the original

        subscription request.

        '
      schema:
        type: string
      example: 626e5ac3-506d-4017-bb8f-973f1c54ddb5
  schemas:
    objectsAttributeSamplesResponse:
      title: Samples
      type: object
      properties:
        total:
          type: integer
          description: The total number of items in the collection.
        schema:
          type: object
          description: JSON Schema definition of the items property.
        items:
          type: array
          description: Collection of time series samples.
          items:
            type: object
            properties:
              value:
                oneOf:
                - type: number
                - type: boolean
                - type: string
              sampleTime:
                type: string
                format: date-time
                description: The date and time that the sample was recorded.
              reliability:
                type: string
                x-metasysType: enum
                x-metasysEnum: reliabilityEnumSet
                description: 'Indicator of the reliability of the sample.


                  If at the time of this sample''s recording the object had the

                  BACnet Status flag of "FAULT" set to `true`, this value will be

                  set to "reliabilityEnumSet.unreliable". Otherwise, the value will

                  be set to "reliabilityEnumSet.reliable".



                  The values for this property come from the `reliabilityEnumSet` enumeration.

                  Find the definition of `reliabilityEnumSet` at the relative URL of `/schemas/enums/reliabilityEnumSet`.


                  **See also:**

                  * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
            required:
            - value
            - sampleTime
            - reliability
        self:
          type: string
          format: uri
          description: A link to this collection of value samples.
        objectUrl:
          type: string
          format: uri
          description: A link to the object that is collecting and storing the samples.
        attribute:
          type: string
          description: The sampled attribute.
      required:
      - total
      - schema
      - items
      - self
      - objectUrl
      - attribute
    timeSeriesStreamingSubscriptionRequest:
      title: Time series streaming subscription request payload
      type: object
      properties:
        items:
          type: array
          description: Collection of items to sign up for.
          items:
            type: object
            properties:
              objectId:
                type: string
                description: 'The identifier of the object.


                  If only `objectId` is specified and not `attributeId`, then trend

                  objects which are objects that have an `objectType` of

                  `trendLogClass`, `trendMapperClass`, `bacnetTrendLogExtClass`,

                  `trendLogNoextensionClass`, `bacnetTrendLogClass` or

                  `bacnetTrendLogMultipleClass` are only supported.

                  '
              attributeId:
                type: string
                x-metasysType: enum
                x-metasysEnum: attributeEnumSet
                description: 'The identifier of the attribute.


                  The values for this property come from the `attributeEnumSet` enumeration.

                  Find the definition of `attributeEnumSet` at the relative URL of `/schemas/enums/attributeEnumSet`.


                  **See also:**

                  * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
              sampledById:
                type: array
                items:
                  type: string
                description: 'Filter samples by objects by supplying one or more `sampledById`

                  values.


                  An attribute may have multiple objects sampling it. Use this

                  parameter to subscribe to samples only from a specific object or

                  set of objects. If no value is given for this parameter, then it

                  will subscribe to samples from all of the objects sampling this

                  attribute.

                  '
            required:
            - objectId
