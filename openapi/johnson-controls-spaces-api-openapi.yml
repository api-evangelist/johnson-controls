  /spaces/{spaceId}:
    get:
      summary: Get a single space
      description: Retrieves the specified space.
      operationId: getSpace
      parameters:
      - $ref: '#/components/parameters/spaceId'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/schemas_space'
              examples:
                spaces:
                  $ref: '#/components/examples/space'
                spaces_15:
                  $ref: '#/components/examples/space_15'
        '403':
          description: The client is not authorized to modify or delete this space.
          content:
            application/vnd.metasysapi.v6:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '404':
          description: Provided identifier does not match any known space
          content:
            application/vnd.metasysapi.v6:
