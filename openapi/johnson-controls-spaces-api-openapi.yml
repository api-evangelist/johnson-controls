          description: 'A collection of errors that is more detail or causes of the containing

            error. This allows for a recursive error structure which a client can

            digest to as much detail as they understand. This is mutually exclusive

            with `innerError`.

            '
          type: array
          items:
            $ref: '#/components/schemas/errorMessage'
