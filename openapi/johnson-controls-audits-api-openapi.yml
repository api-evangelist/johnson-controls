    patch:
      summary: Edit an audit
      description: Allows for discarding an audit.
      operationId: patchAudit
      parameters:
      - $ref: '#/components/parameters/auditId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                activityManagementStatus:
                  type: string
                  description: 'The new activity management status of the audit.


                    The only accepted value of this property is `discarded` because

                    it is the only valid activity management state transition for an

                    audit. Once an audit is discarded, it cannot be changed to any

                    other state.

                    '
                  enum:
                  - discarded
                annotationText:
                  type:
                  - string
                  - 'null'
                  description: The annotation to associate with the change of audit state.
              required:
              - activityManagementStatus
              example:
                activityManagementStatus: discarded
            examples:
              discardAudit:
                summary: Discard an audit
                value:
                  activityManagementStatus: discarded
        required: true
      responses:
        '204':
          description: Success.
        '403':
          $ref: '#/components/responses/general403'
        '405':
          description: 'Method not allowed. The audit is already discarded.

            '
      tags:
      - Audits
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request PATCH \\\n  --url https://metasys-server.example.com/api/v6/audits/4990ee27-7a0a-4b2b-9b27-279e3f1a060c \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"activityManagementStatus\":\"discarded\"}'"
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/audits/4990ee27-7a0a-4b2b-9b27-279e3f1a060c\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .WithHeader(\"Content-Type\", \"application/json\")\n    .PatchStringAsync(\"{\\\"activityManagementStatus\\\":\\\"discarded\\\"}\");"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/audits/4990ee27-7a0a-4b2b-9b27-279e3f1a060c\" `\n  -Method Patch `\n  -Body '{\"activityManagementStatus\":\"discarded\"}' `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n    'Content-Type' = 'application/json'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /audits/4990ee27-7a0a-4b2b-9b27-279e3f1a060c `\n  -Method Patch `\n  -Body '{\"activityManagementStatus\":\"discarded\"}'"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.patch(\n  '/audits/4990ee27-7a0a-4b2b-9b27-279e3f1a060c',\n  '{\"activityManagementStatus\":\"discarded\"}', {\n  headers\n});"
