openapi: 3.2.0
info:
  title: Johnson Controls Audits API
  version: Version 6 for 16.0
  x-logo:
    url: source/images/logo.svg
    href: https://jci-metasys.github.io/
  x-releases:
  - '14.0'
  - '14.1'
  - '15.0'
  - '16.0'
  x-revision: 'Commit ID: 4b227676a'
  description: 'Operations tagged audits across 2 of this provider''s published API definitions: metasys-api-v6-16.json, johnson-controls-metasys-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: Audits
  description: 'How to retrieve, discard, and annotate audits.


    ### Relationships


    Audits have relationships to other resources in the system. Find information

    about the most important below.


    - **objects**


    When users or the system affect objects in the Metasys system, such as analog

    inputs, multistate objects, or binary outputs, audits are generated. Those

    "acted upon" objects then relate to those audits. That relationship is returned

    as part of any audit response.


    - **equipment instances**


    Equipment instance associations to audits build off of the objects association

    explanation. Each equipment instance can contain many points, such as Outdoor

    Air Temperature, Damper Position, or Zone Setpoint. Those points map to actual

    objects in Metasys, as noted above. When users or the system affect those

    objects, audits are generated. If an equipment instance''s point is mapped to one

    of those affected objects the instance is then associated with that audit.


    In short, an equipment instance contains points which map to Metasys objects

    which are affected by an audited action.


    - **spaces**


    Space associations to audits build off of the equipment instance association

    explanation. Equipment instances can serve spaces, such as an Air Handler Unit

    (AHU) serving the floor of a building. Therefore, audits associated with a

    particular equipment instance are associated to the spaces they serve.'
paths:
  /objects/{objectId}/audits:
    get:
      summary: Get audits for an object
      description: Retrieves a collection of audits for the specified object.
      operationId: getObjectAudits
      parameters:
      - $ref: '#/components/parameters/objectId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/originApplication'
      - $ref: '#/components/parameters/classLevel'
      - $ref: '#/components/parameters/actionType'
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/parameters_includeDiscarded'
      - $ref: '#/components/parameters/equipment'
      - $ref: '#/components/parameters/space'
      - $ref: '#/components/parameters/page'
      - name: pageSize
        in: query
        description: The maximum number of items to return in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        example: 100
      - $ref: '#/components/parameters/auditsSort'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/audits'
              examples:
                tenAlarms:
                  $ref: '#/components/examples/first-two-object-audits'
                twoAudits15:
                  $ref: '#/components/examples/first-two-object-audits15'
      tags:
      - Audits
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod /objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/audits\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
