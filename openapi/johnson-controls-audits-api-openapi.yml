    post:
      summary: Add audit annotation
      description: Adds an annotation to an audit.
      operationId: postAuditAnnotation
      parameters:
      - $ref: '#/components/parameters/auditId'
      requestBody:
        required: true
        content:
          application/json:
            example:
              text: Looks okay.
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text of the annotation to create. This must not be `null`, empty, nor only whitespace. Additionally, any surrounding whitespace will be trimmed.
                  minLength: 1
                  maxLength: 255
                  pattern: \S
              required:
              - text
              example:
                text: Looks okay.
      responses:
        '201':
          description: Success.
        '400':
          description: 'Bad request.


            Beyond any request that doesn''t adhere to the expected constraints, this

            operation may fail if the audit is already discarded.

            '
