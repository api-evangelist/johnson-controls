servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: Activities
  description: 'This section describes the operations you can perform on activities. Activities

    are a superset of all alarms and audits in a Metasys system. Use activities

    operations to view audits and alarms. Apply filters to further refine the

    results. ## Activities Event Subscriptions


    Subscribe for activity-related events to receive updates when activities are

    created, discarded, acknowledged, or annotated. #### Subscribing


    To subscribe for activity-related events, complete the following steps:


    1. Obtain a stream ID using the workflow outlined in the

    Streaming section. 2. Use Get Activities and include a

    `METASYS-SUBSCRIBE` header with the stream ID. **Note:** Any filters added to the original `GET` operation also apply the event

    subscription. #### Unsubscribing


    To unsubscribe from an activities event subscription, complete the following

    steps:


    1. Get the `METASYS-SUBSCRIPTION-LOCATION` from the subscribe operation

    response. 2. Issue a

    Delete activities subscription

    request to `METASYS-SUBSCRIPTION-LOCATION`. **See also:**


    - Get a stream

    - Streaming


    #### Events


    There are five event types sent by the activities subscription: acknowledged,

    annotate, discard, new, and heartbeat. - `activity.heartbeat` - A heartbeat event is sent to show that the subscription

    is still alive. A heartbeat is a JSON string with the current UTC date time in

    ISO 8601 format and is sent every 120 seconds. Heartbeat Payload Example


    ```json

    {

    "currentTime": "2021-02-16T16:21:10.23Z",

    "subscriptionIds": ["c569a157-7315-4f32-bc8f-11607f075660"]

    }

    ```


    - `activity.alarm.ack` - An alarm acknowledge event is sent to indicate that the

    management status has changed to acknowledged. Acknowledged Alarm Payload Example


    ```json

    {

    "subscriptionIds": ["788fc8af-ff49-4501-b85b-e3d407a38a9e"],

    "activity": {

    "id": "6443a123-ddcd-47e7-9828-d872db6a7b4f",

    "itemReference": "{hostname}:{deviceHostname}/AHU1.OA_T",

    "objectName": "OA_T",

    "activityManagementStatus": "acknowledged",

    "creationTime": "2021-02-16T20:30:00Z",

    "spaces": [

    {

    "id": "20b27e9a-d721-5e88-9942-85297cc57ea1",

    "itemReference": "{hostname}:{deviceHostname}/Generic 1.Building 1.Floor 1",

    "name": "Floor 1",

    "spaceUrl": "https://metasys-server.example.com/api/v6/space/4e0df8ec-c641-5fd0-9ed6-f2d980b1d26f"

    }

    ],

    "equipment": [

    {

    "id": "4e0df8ec-c641-5fd0-9ed6-f2d980b1d26f",

    "itemReference": "{hostname}:{deviceHostname}/equipment.Engine1",

    "equipmentName": "Engine1",

    "shortName": null,

    "equipmentUrl": "https://metasys-server.example.com/api/v6/equipment/4e0df8ec-c641-5fd0-9ed6-f2d980b1d26f"

    }

    ],

    "objectUrl": "https://metasys-server.example.com/api/v6/objects/16defc31-1333-5379-82e7-576a6f1e8b50",

    "objectId": "16defc31-1333-5379-82e7-576a6f1e8b50",

    "alarm": {

    "message": "",

    "alarmGeneratorObject": {

    "objectReference": "{hostname}:{deviceHostname}/AHU1.OA_T.Alarm1",

    "referencedObject": {

    "objectUrl": "https://metasys-server.example.com/api/v6/objects/bfcc3fce-a182-53c0-a529-268f8184496b"

    }

    },

    "isAckRequired": true,

    "acknowledgedTime": "2021-02-16T20:31:02Z",

    "type": "alarmValueEnumSet.avHiAlarm",

    "priority": 70,

    "category": "objectCategoryEnumSet.generalCategory",

    "annotationsUrl": "https://metasys-server.example.com/api/v6/alarms/6443a123-ddcd-47e7-9828-d872db6a7b4f/annotations",

    "self": "https://metasys-server.example.com/api/v6/alarms/6443a123-ddcd-47e7-9828-d872db6a7b4f",

    "triggerValue": {

    "item": "2.0",

    "schema": {

    "type": "string",

    "metasysType": "string",

    "units": {

    "id": "unitEnumSet.degF",

    "title": "deg F"

    }

    }

    },

    "description": ""

    }

    },

    "effectivePermission": {

    "id": "6443a123-ddcd-47e7-9828-d872db6a7b4f",

    "canAcknowledge": true,

    "canDiscard": true,

    "canAnnotate": true

    }

    }

    ```


    - `activity.alarm.annotate` - An alarm annotate event is sent when an annotation

    is added to an alarm activity, providing the information for the annotated

    alarm.'
paths:
  /activities:
    get:
      summary: List activities
      description: Retrieves a collection of activities.
      operationId: getActivities
      parameters:
      - $ref: '#/components/parameters/activityType'
      - $ref: '#/components/parameters/activitiesIncludeDiscarded'
      - $ref: '#/components/parameters/continuationToken'
      - $ref: '#/components/parameters/activitiesSort'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/equipment'
      - $ref: '#/components/parameters/object'
      - $ref: '#/components/parameters/space'
      - $ref: '#/components/parameters/priorityRange'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/includeAcknowledged'
      - $ref: '#/components/parameters/activitiesIncludeAcknowledgementRequired'
      - $ref: '#/components/parameters/activitiesIncludeAcknowledgementNotRequired'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/originApplication'
      - $ref: '#/components/parameters/classLevel'
      - $ref: '#/components/parameters/actionType'
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/metasysSubscribe'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/activities'
              examples:
                tenActivities:
                  $ref: '#/components/examples/first-two-activities'
                twoActivities15:
                  $ref: '#/components/examples/first-two-activities15'
          headers:
            METASYS-SUBSCRIPTION-LOCATION:
              description: The location of the newly created subscription.
              schema:
                type: string
                format: uri
              example: https://metasys-server.example.com/api/v6/_GROUP_NAME_/streams/72d4ee80-e324-4922-b0ec-1425079d892a/subscriptions/538f00be-5788-4f68-a60e-45a14356c7ef
              required: false
      tags:
      - Activities
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url 'https://metasys-server.example.com/api/v6/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit' \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod "/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit"'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/activities?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /activities/batch:
    post:
      tags:
      - Activities
      summary: Batch operations
      operationId: postActivitiesBatch
      requestBody:
        required: true
        content:
          application/json:
            examples:
              batchDiscard:
                summary: Discard
                description: 'A request to discard multiple activities (2 audits and 2 alarms).

                  One audit request and one alarm request include annotation text

                  and the other requests do not.

                  '
                value:
                  method: PATCH
                  requests:
                  - id: '1'
                    requestUrl: https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969
                    body:
                      activityManagementStatus: discarded
                      annotationText: Issue resolved
                  - id: '2'
                    requestUrl: https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30
                    body:
                      activityManagementStatus: discarded
                  - id: '3'
                    requestUrl: https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6
                    body:
                      activityManagementStatus: discarded
                      annotationText: Issue resolved
                  - id: '4'
                    requestUrl: https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007
                    body:
                      activityManagementStatus: discarded
              batchAnnotate:
                summary: Annotate
                description: 'A request to annotate multiple audit activities.

                  '
                value:
                  method: POST
                  requests:
                  - id: '1'
                    requestUrl: https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969/annotations
                    body:
                      text: Issue resolved
                  - id: '2'
                    requestUrl: https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30/annotations
                    body:
                      text: Issue resolved
              batchAcknowledge:
                summary: Acknowledge
                description: 'A request to acknowledge two alarm activities.

                  '
                value:
                  method: PATCH
                  requests:
                  - id: '1'
                    requestUrl: https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6
                    body:
                      activityManagementStatus: acknowledged
                      annotationText: Issue resolved
                  - id: '2'
                    requestUrl: https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007
                    body:
                      activityManagementStatus: acknowledged
                      annotationText: Issue resolved
            schema:
              type: object
              example:
                method: PATCH
                requests:
                - id: '1'
                  requestUrl: https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969
                  body:
                    activityManagementStatus: discarded
                    annotationText: Issue resolved
                - id: '2'
                  requestUrl: https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30
                  body:
                    activityManagementStatus: discarded
                - id: '3'
                  requestUrl: https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6
                  body:
                    activityManagementStatus: discarded
                    annotationText: Issue resolved
                - id: '4'
                  requestUrl: https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007
                  body:
                    activityManagementStatus: discarded
              required:
              - method
              - requests
              properties:
                method:
                  type: string
                  description: The HTTP method to use for each request.
                  oneOf:
                  - enum:
                    - PATCH
                  - enum:
                    - POST
                  - enum:
                    - GET
                    x-releases:
                      implementedAt: '15.0'
                requests:
                  type: array
                  description: A collection of entries that represent the operations to invoke.
                  items:
                    type: object
                    required:
                    - id
                    - requestUrl
                    properties:
                      id:
                        type: string
                        description: A client supplied unique identifier for this request. The `id` values supplied by the client will be used to uniquely identify the responses that correspond to each request.
                      requestUrl:
                        type: string
                        format: uri-reference
                        description: "An absolute URL to a resource within either `audits` or\n`alarms`. Here are the possibilities.\n\n- _An audit:_ Used when discarding an audit (for example,\n  `https://metasys-server.example.com/api/v6/audits/a2649aa8-f3eb-569e-ac7e-cb97a45d7b0e`).\n- _Annotations for an audit:_ Used when adding an\n  annotation to an audit (for example,\n  `https://metasys-server.example.com/api/v6/audits/a2649aa8-f3eb-569e-ac7e-cb97a45d7b0e/annotations`).\n- _An alarm:_ Used when acknowledging or discarding an\n  alarm (for example,\n  `https://metasys-server.example.com/api/v6/alarms/a2649aa8-f3eb-569e-ac7e-cb97a45d7b0e`).\n- _Annotations for an alarm:_ Used when adding an\n  annotation to an alarm (for example,\n  `https://metasys-server.example.com/api/v6/alarms/a2649aa8-f3eb-569e-ac7e-cb97a45d7b0e/annotations`).\n\n**Note:** In all of the examples the URL references `audits`\nor `alarms` and not `activities`.\n"
                      body:
                        type: object
                        description: A body that is appropriate for the specified operation.
      responses:
        '200':
          description: Success
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                type: object
                readOnly: true
                required:
                - responses
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - status
                      properties:
                        id:
                          type: string
                          description: One of the client-supplied unique request identifiers from the request. This identifier is used to match the response to the correct operation in the request.
                        status:
                          type: integer
                          description: "The HTTP Status code returned for the corresponding\noperation. Beside the\n[standard HTTP status codes](#section/Validation), the\nfollowing status codes may also be returned:\n\n- 400: Bad request. Changing the state of an activity\n  may fail for a few reasons:\n  - The request contains annotation text but the\n    associated object is validated. Activity generated\n    for a validated object doesn't support an\n    `annotationText` property in the request.\n"
                        body:
                          oneOf:
                          - type: string
                          - type: object
                          - $ref: '#/components/schemas/standardErrorMessage'
                          description: 'The response body for the corresponding operation.


                            <!-- The body can vary. Some errors have no body even

                            though it would be helpful. Others include a .Net aspnet MVC binding error.

                            That has a CR written on it and I''d rather not document it until the CR has been triaged.

                            see G4CR-8556 which has a comment that docs may need updating based on triage. -->

                            '
              examples:
                batchDiscardResponse:
                  summary: Batch response
                  description: 'This is an example response to a batch request. Two of the

                    operations succeeded and two of them failed.

                    '
                  value:
                    responses:
                    - id: '1'
                      status: 204
                    - id: '2'
                      status: 400
                    - id: '3'
                      status: 204
                    - id: '4'
                      status: 400
      description: 'Used to invoke multiple activity operations in a single HTTP request. In this

        version of the API, the only activity-related operations that can be used in a

        batch are listed below.


        **See also**


        - Edit an audit

        - Add audit annotation

        - Edit an alarm'
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request POST \\\n  --url https://metasys-server.example.com/api/v6/activities/batch \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"method\":\"PATCH\",\"requests\":[{\"id\":\"1\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"2\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\",\"body\":{\"activityManagementStatus\":\"discarded\"}},{\"id\":\"3\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"4\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\",\"body\":{\"activityManagementStatus\":\"discarded\"}}]}'"
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/activities/batch\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .WithHeader(\"Content-Type\", \"application/json\")\n    .PostStringAsync(\"{\\\"method\\\":\\\"PATCH\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"2\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}},{\\\"id\\\":\\\"3\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"4\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}}]}\");"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/activities/batch\" `\n  -Method Post `\n  -Body '{\"method\":\"PATCH\",\"requests\":[{\"id\":\"1\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"2\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\",\"body\":{\"activityManagementStatus\":\"discarded\"}},{\"id\":\"3\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"4\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\",\"body\":{\"activityManagementStatus\":\"discarded\"}}]}' `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n    'Content-Type' = 'application/json'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /activities/batch `\n  -Method Post `\n  -Body '{\"method\":\"PATCH\",\"requests\":[{\"id\":\"1\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"2\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\",\"body\":{\"activityManagementStatus\":\"discarded\"}},{\"id\":\"3\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"4\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\",\"body\":{\"activityManagementStatus\":\"discarded\"}}]}'"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.post(\n  '/activities/batch',\n  '{\"method\":\"PATCH\",\"requests\":[{\"id\":\"1\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"2\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\",\"body\":{\"activityManagementStatus\":\"discarded\"}},{\"id\":\"3\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\",\"body\":{\"activityManagementStatus\":\"discarded\",\"annotationText\":\"Issue resolved\"}},{\"id\":\"4\",\"requestUrl\":\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\",\"body\":{\"activityManagementStatus\":\"discarded\"}}]}', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/activities/batch\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\" ,\n    \"Content-Type\": \"application/json\"\n}\npayload = \"{\\\"method\\\":\\\"PATCH\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"2\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}},{\\\"id\\\":\\\"3\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"4\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}}]}\"\n\nconn.request(\"POST\", url, payload, headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/activities/batch\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .header(\"content-type\", \"application/json\")\n    .method(\"POST\", HttpRequest.BodyPublishers.ofString(\"{\\\"method\\\":\\\"PATCH\\\",\\\"requests\\\":[{\\\"id\\\":\\\"1\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/3e19d8d8-bb2b-5302-8283-781dcff2b969\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"2\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/audits/865c6e69-9725-5641-83ed-71447b766a30\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}},{\\\"id\\\":\\\"3\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/79751f7a-c86a-5a45-8e0e-99a7fd23bdc6\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\",\\\"annotationText\\\":\\\"Issue resolved\\\"}},{\\\"id\\\":\\\"4\\\",\\\"requestUrl\\\":\\\"https://metasys-server.example.com/api/v6/alarms/7d97c328-fae1-569b-a559-964215b9e007\\\",\\\"body\\\":{\\\"activityManagementStatus\\\":\\\"discarded\\\"}}]}\"))\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
