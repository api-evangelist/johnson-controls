components:
  parameters:
    classLevel:
      name: classLevel
      in: query
      description: 'Filter by list of class levels. The class level of an audit indicates the

        class or family the audit belongs to. Typically, each level of audit

        provides additional detail about the system, with Diagnostic audits being

        the most verbose.


        The Enabled Audit Level attribute (`attributeEnumSet.auditEnabledClasLev`)

        determines which audit levels the system generates. Therefore, be aware that

        there will be no audits to return if the Enabled Audit Level attribute is

        set too low to generate audits at the desired class level in this filter.

        This attribute is set per device (for audits generated on that device).



        The acceptable values for the elements of this parameter come from the `auditClassesEnumSet` enumeration.

        Only the long name of the class level (for example, `auditClassesEnumSet.userActionAuditClass` instead of `userActionAuditClass`) is accepted.

        Find the definition of `auditClassesEnumSet` at the relative URL of `/schemas/enums/auditClassesEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        singleClass:
          summary: Single Level
          value:
          - auditClassesEnumSet.userActionAuditClass
        multipleClasses:
          summary: Multiple levels
          value:
          - auditClassesEnumSet.userActionAuditClass
          - auditClassesEnumSet.systemErrorAuditClass
      x-metasysEnum: auditClassesEnumSet
      schema:
        type: array
        items:
          type: string
          x-metasysType: enum
          x-metasysEnum: auditClassesEnumSet
    activitiesIncludeAcknowledgementNotRequired:
      name: includeAcknowledgementNotRequired
      in: query
      description: 'Determines whether activities which can not be acknowledged are included in

        the results. When the value is `true` then the results will include

        activities which cannot be acknowledged. When the value is `false` then the

        results will not include activities which cannot be acknowledged.


        The use of this parameter implies a filter of `activityType=alarm` and the

        results will not include any audits.

        '
      example: true
      schema:
        type: boolean
        default: true
    endTime:
      name: endTime
      in: query
      description: Only include results generated on or before this date-time.
      schema:
        type: string
        format: date-time
      example: '2018-05-21T13:58:20.243Z'
    category:
      name: category
      in: query
      description: 'The authorization category of the requested activities.



        The acceptable values for the elements of this parameter come from the `objectCategoryEnumSet` enumeration.

        Only the long name of the object category (for example, `objectCategoryEnumSet.hvacCategory` instead of `hvacCategory`) is accepted.

        Find the definition of `objectCategoryEnumSet` at the relative URL of `/schemas/enums/objectCategoryEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        singleCategory:
          summary: HVAC category
          value:
          - objectCategoryEnumSet.hvacCategory
        multiplesCategories:
          summary: Multiple Categories
          value:
          - objectCategoryEnumSet.hvacCategory
          - objectCategoryEnumSet.fireCategory
      x-metasysEnum: objectCategoryEnumSet
      schema:
        type: array
        items:
          type: string
          x-metasysType: enum
          x-metasysEnum: objectCategoryEnumSet
    object:
      name: object
      in: query
      description: Filter by list of object identifiers.
      example:
      - 06d77c63-6357-467a-a306-5e1ab3eb3aa7
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    originApplication:
      name: originApplication
      in: query
      description: 'Filter by list of origin applications. The origin application property

        indicates which application in Metasys generated the audit message.



        The acceptable values for the elements of this parameter come from the `auditOriginAppEnumSet` enumeration.

        Only the long name of the origin application (for example, `auditOriginAppEnumSet.deviceManagerAuditOriginApp` instead of `deviceManagerAuditOriginApp`) is accepted.

        Find the definition of `auditOriginAppEnumSet` at the relative URL of `/schemas/enums/auditOriginAppEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        singleOrigin:
          summary: Single Origin
          value:
          - auditOriginAppEnumSet.deviceManagerAuditOriginApp
        multipleOrigins:
          summary: Multiple Origins
          value:
          - auditOriginAppEnumSet.deviceManagerAuditOriginApp
          - auditOriginAppEnumSet.siteServicesAuditOriginApp
      x-metasysEnum: auditOriginAppEnumSet
      schema:
        type: array
        items:
          type: string
          x-metasysType: enum
          x-metasysEnum: auditOriginAppEnumSet
    actionType:
      name: actionType
      in: query
      description: 'Filter by list of action types. The action type property indicates the user

        or system action performed.



        The acceptable values for the elements of this parameter come from the `auditActionTypeEnumSet` enumeration.

        Only the long name of the action type (for example, `auditActionTypeEnumSet.writeAuditActionType` instead of `writeAuditActionType`) is accepted.

        Find the definition of `auditActionTypeEnumSet` at the relative URL of `/schemas/enums/auditActionTypeEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        singleAction:
          summary: Single Action Type
          value:
          - auditActionTypeEnumSet.writeAuditActionType
        multipleActions:
          summary: Multiple Action Types
          value:
          - auditActionTypeEnumSet.writeAuditActionType
          - auditActionTypeEnumSet.commandAuditActionType
      x-metasysEnum: auditActionTypeEnumSet
      schema:
        type: array
        items:
          type: string
          x-metasysType: enum
          x-metasysEnum: auditActionTypeEnumSet
    space:
      name: space
      in: query
      description: Filter by list of space identifiers.
      example:
      - 214f52d1-0c56-4a29-a690-abe5656d1647
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    equipment:
      name: equipment
      in: query
      description: Filter by list of equipment identifiers.
      example:
      - b7ed8b3e-cb95-410d-aaa7-37158852c398
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    priorityRange:
      name: priorityRange
      in: query
      description: Includes only results within the specified alarm priority range, from 0 to 255 inclusive.
      schema:
        type: string
        pattern: ^\d+,\d+$
      example: 0,255
    activitiesSort:
      name: sort
      in: query
      description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        default: creationTime
        enum:
        - creationTime
        - -creationTime
        - priority
        - -priority
      example: creationTime
    activityType:
      name: activityType
      in: query
      description: 'Limit the activities returned to a specific type

        '
      example:
      - alarm
      schema:
        type: array
        items:
          type: string
          maxItems: 2
          enum:
          - alarm
          - audit
    activitiesIncludeDiscarded:
      name: includeDiscarded
      in: query
      description: "Determines whether discarded activities will be included in the results or\nbe the only type of activity in the results. Discarded activities are those\nfor which the `activityManagementStatus` is `discarded`.\n\nThis parameter can produce 3 different types of results.\n\n- `true` - Return only discarded activities in the response.\n- `false` - Do not include any discarded activities in the response.\n- _missing_ - (default) Discarded status is ignored; both discarded and\n  non-discarded activities are returned.\n"
      example: false
      schema:
        type: boolean
    metasysSubscribe:
      name: METASYS-SUBSCRIBE
      in: header
      description: 'If present, subscribes the client for streaming events associated with the

        resource. The value of this header is a stream id obtained by opening a

        stream with _Get a stream_. The response will have a

        `METASYS-SUBSCRIPTION-LOCATION` header which identifies the created

        subscription.


        **See also:**


        - [Get a stream](#operation/getStream)

        '
      required: false
      schema:
        type: string
      example: 40e47e37-0f24-4101-8e1d-de96af4b648b
    activitiesIncludeAcknowledgementRequired:
      name: includeAcknowledgementRequired
      in: query
      description: 'Determines whether activities which can be acknowledged are included in the

        results. When the value is `true`, activities which can be acknowledged will

        be included in the results. When `false`, activities which can be

        acknowledged will not be included in the results.


        The use of this parameter implies a filter of `activityType=alarm` and the

        results will not include any audits.

        '
      example: true
      schema:
        type: boolean
        default: true
    streamId:
      name: streamId
      in: path
      required: true
      description: 'The stream identifier that contains the subscription. This is the unique

        identifier for the client''s stream obtained via `GET /stream`.

        '
      schema:
        type: string
      example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
    type:
      name: type
      in: query
      description: 'Limits the alarms returned to specified types.



        The acceptable values for the elements of this parameter come from the `alarmValueEnumSet` enumeration.

        Only the long name of the alarm value (for example, `alarmValueEnumSet.avHighLimit` instead of `avHighLimit`) is accepted.

        Find the definition of `alarmValueEnumSet` at the relative URL of `/schemas/enums/alarmValueEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        multiple:
          summary: Multiple Types
          value:
          - alarmValueEnumSet.avHighLimit
          - alarmValueEnumSet.avLowLimit
          x-use-in-snippets: true
      x-metasysEnum: alarmValueEnumSet
      schema:
        type: array
        items:
          type: string
          maxItems: 100
          x-metasysType: enum
          x-metasysEnum: alarmValueEnumSet
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: 'The identifier of the subscription to act upon. This is the unique

        identifier to the subscription for a specific resource or type of event.

        This value is found as the last parameter of a

        `METASYS-SUBSCRIPTION-LOCATION` header returned for the original

        subscription request.

        '
      schema:
        type: string
      example: 626e5ac3-506d-4017-bb8f-973f1c54ddb5
    continuationToken:
      name: continuationToken
      in: query
      description: Provide a token from a previous request to fetch the next set of results. Ignored for streaming subscriptions.
      schema:
        type: string
      example: eyJhdWRpdCI6eyJpZCI6IjgOTQ2NjUzLTlmM...
    includeAcknowledged:
      name: includeAcknowledged
      in: query
      description: "Determines whether acknowledged alarms will be included in the results or be\nthe only type of alarm in the results. Acknowledged alarms are those which\nhave an `acknowledgedTime` value set.\n\nThis parameter can produce 3 different types of results.\n\n- `true` - Return only acknowledged alarms in the response.\n- `false` - Do not include any acknowledged alarms in the response.\n- _missing_ - (default) Acknowledged status is ignored; both acknowledged\n  and non-acknowledged alarms are returned.\n"
      example: false
      schema:
        type: boolean
    user:
      name: user
      in: query
      description: 'Filter by list of users. The user property indicates which user initiated

        the action being audited.

        '
      examples:
        singleUser:
          summary: Single User
          value:
          - metasysuser
        multipleUsers:
          summary: Multiple Users
          value:
          - metasysuser
          - johnsmith
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    startTime:
      name: startTime
      in: query
      description: Only include results generated on or after this date-time.
      schema:
        type: string
        format: date-time
      example: '2018-05-21T13:58:20.243Z'
  schemas:
    standardErrorMessage:
      title: Standard Error
      description: A general error of the API.
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'A Metasys specific status code. The format of this code is variable. It

            uses namespace/qualified format for `statusName` values. If the value is

            qualified with just an enumeration

            ("{namespace}:{enumeration}.{member}", e.g.

            "enum.core:statusEnumSet.attributeNotFound"), then the display text

            comes from the enumeration schema available at

            `/schemas/enums/{enumeration}`. If the value is qualified with a

            namespace ("{namespace}:{enumeration}.{member}", e.g.

            "api.diagram:error.saveFailed"), then the display text is the

            responsibility of the client.

            '
        message:
          type: string
          description: The display string message that correlates to `statusName`.
        details:
          type:
          - object
          - 'null'
          description: 'An object containing specific details to the type of error. Each type of

            error may have different detail properties and value types.

            '
        innerError:
          allOf:
          - description: 'An error that is more detailed or a cause of the containing error.

              This allows for a recursive error structure which a client can

              digest to as much detail as they understand. This is mutually

              exclusive with `innerErrors`.

              '
          - $ref: '#/components/schemas/standardErrorMessage'
        innerErrors:
          description: 'A collection of errors that is more detailed or causes of the containing

            error. This allows for a recursive error structure which a client can

            digest to as much detail as they understand. This is mutually exclusive

            with `innerError`.

            '
          type: array
          items:
            $ref: '#/components/schemas/standardErrorMessage'
    objectReferenceDefinition:
      type: object
      additionalProperties: false
      description: A reference to an object in the system.
      properties:
        objectReference:
          type: string
          description: The fully qualified referenced of the object.
        referencedObject:
          type: object
          description: Meta-data about the referenced object.
          properties:
            objectName:
              type: string
              description: The name of the object.
            objectUrl:
              type: string
              description: A link to the object.
              format: uri
      required:
      - objectReference
      x-metasysType: objectReference
    anyDataTypeSchemaRequired:
      type: object
      description: A variant data type that can hold a value of any of the built-in data types of the Metasys object model.
      x-metasysType: any
      properties:
        item: {}
        schema:
          $ref: '#/components/schemas/dataTypeMetaSchema'
      required:
      - item
      - schema
    activities:
      type: object
      additionalProperties: false
      properties:
        total:
          type: integer
          description: The total number of activities in the collection.
        items:
          type: array
          description: Collection of activities.
          items:
            oneOf:
            - type: object
              title: Alarm activity
              description: An alarm activity.
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: The identifier of the activity.
                itemReference:
                  type: string
                  description: The fully qualified reference of the object.
                objectName:
                  type: string
                  description: The name of the object.
                objectId:
                  type: string
                  description: The identifier of the object that generated this activity.
                objectUrl:
                  type: string
                  description: A link to the object that generated this activity.
                  format: uri
                discardedTime:
                  type:
                  - string
                  - 'null'
                  description: 'The date-time representing the time when a user discarded the activity.

                    This property will only be present if the `activityManagementStatus` of

                    the alarm or audit for the activity is `discarded`.

                    '
                  format: date-time
                creationTime:
                  type: string
                  description: The date-time for when the activity was detected.
                  format: date-time
                spaces:
                  type: array
                  description: 'The collection of spaces associated with the object on which the

                    activity occurred.

                    '
                  items:
                    $ref: '#/components/schemas/space'
                equipment:
                  type: array
                  description: 'The collection of equipment associated with the object on which the

                    activity occurred.

                    '
                  items:
                    $ref: '#/components/schemas/equipment'
                activityManagementStatus:
                  type: string
                  description: 'The activity management status of this alarm. The values of this

                    property are:


                    - `pending` - Indicates a user has not yet acted upon the alarm.

                    - `acknowledged` - Indicates a user recognized and viewed the alarm.

                    - `discarded` - Indicates a user acted upon or dismissed the alarm.

                    '
                alarm:
                  type: object
                  properties:
                    description:
                      type: string
                      description: 'A more detailed description of the triggered alarm, either

                        describing the object that triggered the alarm or the alarm itself.

                        '
                    acknowledgedTime:
                      type:
                      - string
                      - 'null'
                      description: 'The date-time representing the time when this activity message was

                        acknowledged.

                        '
                      format: date-time
                    message:
                      type: string
                      description: The alarm message.
                    isAckRequired:
