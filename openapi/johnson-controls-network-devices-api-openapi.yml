    delete:
      summary: Deletes a network device
      description: 'Deletes an engine or a server which is a child device of the site director.

        Cannot be used to delete controllers, integrations, or the site director.


        **Note:** The device must be offline for the operation to succeed.'
      operationId: deleteNetworkDevice
      parameters:
      - $ref: '#/components/parameters/networkDeviceId'
      responses:
        '204':
          description: Success.
        '400':
          description: The specified device is not a child engine or a child server.
        '403':
          description: The user does not have the Manage Devices & Sites privilege.
        '409':
          description: The specified device cannot be deleted because it is not offline.
      tags:
      - network devices
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request DELETE \\\n  --url https://metasys-server.example.com/api/v6/networkDevices/d9bf66bd-22f8-425b-82a4-44ba153d79c7 \\\n  --header \"Authorization: Bearer $accessToken\""
