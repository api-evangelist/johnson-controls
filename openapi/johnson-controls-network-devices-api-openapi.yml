    includeIncomplete:
      name: includeIncomplete
      in: query
      description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

        Set to true to include incomplete devices and servers in the response. An

        incomplete network device is one that has not yet synchronized its archive

        with the site director. As a result, these devices have minimal information

        available. When set to true, incomplete devices will be returned using the

        incompleteNetworkDevice schema. (You can use the _Sync Engine_ command on a

        network engine to force synchronization with the site director.)

        '
      x-releases:
        implementedAt: '15.0'
      schema:
        type: boolean
        default: false
