  schemas:
    networkDevice:
      type: object
      properties:
        id:
          type: string
          description: The identifier of the network device.
        itemReference:
          type: string
          description: The fully qualified reference of the network device.
        name:
          type: string
          description: The full name of the network device.
        objectType:
          type: string
          description: 'The type of this network device as defined by the `objectTypeEnumSet`.


            The values for this property come from the `objectTypeEnumSet` enumeration.

            Find the definition of `objectTypeEnumSet` at the relative URL of `/schemas/enums/objectTypeEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: objectTypeEnumSet
        objectTypeVersion:
          type: string
          description: The version of `objectType` that is used for this object.
          readOnly: true
        productVersion:
          type: string
          description: The product version of the object.
          readOnly: true
        description:
          type: string
          description: The description for the network device.
        firmwareVersion:
          type: string
          description: The firmware version for the network device. This property will be an empty string "" if the device does not support a firmware version.
        objectCategory:
          type: string
          description: 'The authorization category for the network device.


            The values for this property come from the `objectCategoryEnumSet` enumeration.

            Find the definition of `objectCategoryEnumSet` at the relative URL of `/schemas/enums/objectCategoryEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: objectCategoryEnumSet
        timeZone:
          type:
          - string
          - 'null'
          description: 'The time zone for the network device. This property will be `null` if the device does not support a time zone.


            The values for this property come from the `timeZoneEnumSet` enumeration.

            Find the definition of `timeZoneEnumSet` at the relative URL of `/schemas/enums/timeZoneEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: timeZoneEnumSet
        self:
          type: string
          description: The link to the network device.
          format: uri
        parentUrl:
          type:
          - string
          - 'null'
          description: A link to the network device that is the parent of this network device.
          format: uri
        networkDevicesUrl:
          type: string
          description: A link to the network devices that are children of this network device.
          format: uri
        equipmentUrl:
          type: string
          description: A link to the equipment instances hosted by this network device.
          format: uri
        spacesUrl:
          type: string
          description: A link to the spaces that are served by this network device.
          format: uri
        objectsUrl:
          type: string
          description: A link to the objects contained within this network device.
          format: uri
        trendedAttributesUrl:
          type: string
          description: A link to the attributes on this network device for which samples are available.
          format: uri
        alarmsUrl:
          type: string
          description: A link to the alarms available for this network device.
          format: uri
        allowHttp:
          x-releases:
            implementedAt: '15.0'
          type: boolean
          description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

            Indicates if the network device allows HTTP communication. This property will be `false` if the device has blocked the HTTP port (port 80).'
        jciIpCommMode:
          x-releases:
            implementedAt: '15.0'
          type: string
          description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

            The BACnet IP communication mode for the network device.


            The values for this property come from the `ipCommModeEnumSet` enumeration.

            Find the definition of `ipCommModeEnumSet` at the relative URL of `/schemas/enums/ipCommModeEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: ipCommModeEnumSet
        ipAddress:
          type:
          - string
          - 'null'
          description: The IPv4 address of the network device. This will be `null` if the device does not support an IP address.
          format: ipv4
        deviceIpv6Address:
          x-releases:
            implementedAt: '15.0'
          type:
          - string
          - 'null'
          description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

            The IPv6 address of the network device. This will be `null` if the device does not support an IPv6 address.'
          format: ipv6
        certificateExpirationDate:
          type:
          - string
          - 'null'
          description: 'The expiration date & time of the device''s HTTPS certificate. This will

            be `null` if the device does not support HTTPS certificates or there is

            no certificate present.

            '
          format: date-time
        pairing:
          type: object
          description: Provides indicators to the pairing capabilities of the network device.
          properties:
            supported:
              type: boolean
              description: Indicates if the device supports the pairing operation.
            paired:
              type: boolean
              description: Indicates if the device has been authenticated with the site director. This property will always be `false` if `supported` is `false`.
          required:
          - supported
          - paired
        ethernetMacAddress:
          x-releases:
            implementedAt: '16.0'
          type: string
          description: '<span style="color: #92989b; font-size: 13px">RELEASE</span>:<span style="color: #186faf;"> <strong>16.0</strong></span>\

            The MAC address of the network device.'
          format: mac-address
        modelName:
          x-releases:
            implementedAt: '16.0'
          type: string
          description: '<span style="color: #92989b; font-size: 13px">RELEASE</span>:<span style="color: #186faf;"> <strong>16.0</strong></span>\

            The model name of the network device.'
      required:
      - id
      - itemReference
      - name
      - objectType
      - description
      - firmwareVersion
      - objectCategory
      - timeZone
      - self
      - parentUrl
      - networkDevicesUrl
      - equipmentUrl
      - spacesUrl
      - objectsUrl
      - trendedAttributesUrl
      - alarmsUrl
      - ipAddress
      - certificateExpirationDate
      - pairing
    incompleteNetworkDevice:
      type: object
      x-releases:
        implementedAt: '15.0'
      description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

        An incomplete network device is a network device that has not been fully

        populated with all of its properties. This is typically the case when the

        network device is not reachable or when the API is unable to retrieve all of

        the properties of the network device.

        '
      additionalProperties: false
      properties:
        id:
          type: string
          description: The identifier of the network device.
        itemReference:
          type: string
          description: The fully qualified reference of the network device.
        name:
          type: string
          description: The full name of the network device.
        self:
          type: string
          description: The link to the network device.
          format: uri
        networkDevicesUrl:
          type: string
          description: A link to the network devices that are children of this network device.
          format: uri
        equipmentUrl:
          type: string
          description: A link to the equipment instances hosted by this network device.
          format: uri
        spacesUrl:
          type: string
          description: A link to the spaces that are served by this network device.
          format: uri
        objectsUrl:
          type: string
          description: A link to the objects contained within this network device.
          format: uri
        trendedAttributesUrl:
          type: string
          description: A link to the attributes on this network device for which samples are available.
          format: uri
        alarmsUrl:
          type: string
          description: A link to the alarms available for this network device.
          format: uri
      required:
      - id
      - itemReference
      - name
      - self
      - networkDevicesUrl
      - equipmentUrl
      - spacesUrl
      - objectsUrl
      - trendedAttributesUrl
      - alarmsUrl
    networkDevices:
      type: object
      properties:
        total:
          type: integer
          description: The total number of items in the collection.
        items:
          type: array
          description: 'The collection of network devices. Incomplete network devices are only

            included if the `includeIncomplete` query parameter is set to `true` and

            the API is at release 15.0 or greater.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/networkDevice'
            - $ref: '#/components/schemas/incompleteNetworkDevice'
        next:
          type:
          - string
          - 'null'
          description: A link to the next page of results.
          format: uri
        previous:
          type:
          - string
          - 'null'
          description: A link to the previous page of results.
          format: uri
        self:
          type: string
          description: A link to this equipment collection.
          format: uri
        effectivePermissions:
          type: object
          description: Describes the effective permissions the client has for the network devices in the response.
          properties:
            canDelete:
              type: array
              description: The IDs of devices that can be deleted by the client.
              items:
                type: string
            canView:
              type: array
              description: The IDs of devices that can be viewed by the client.
              items:
                type: string
            canModify:
              type: array
              description: The IDs of devices that can be edited by the client.
              items:
                type: string
          required:
          - canDelete
          - canView
          - canModify
      required:
      - total
      - items
      - next
      - previous
      - self
      - effectivePermissions
  securitySchemes:
    Bearer-Authentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Most of the calls in the API use bearer token authentication. What this

        means is that these requests require an `Authorization` header to be set to

        a value with the following format: `Bearer: {accessToken}`. Use the

        [`/login`](#operation/createToken) operation to request an `accessToken`. An

        example of the full header would look like the following:

        `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1...`.


        **Note:** This example access token is truncated.


        The expiration time of the access token is based on the user''s Metasys

        profile.

        '
    API-Key-Authentication:
      type: apiKey
      in: query
      name: access_token
