                $ref: '#/components/schemas/networkDevice'
              examples:
                spaces:
                  $ref: '#/components/examples/networkDevice'
      tags:
      - network devices
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/networkDevices/d9bf66bd-22f8-425b-82a4-44ba153d79c7 \\\n  --header \"Authorization: Bearer $accessToken\""
