          Invoke-MetasysMethod /equipment/b78fa672-3ec9-4794-bd00-7aeafeb9cde0/networkDevices'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/equipment/b78fa672-3ec9-4794-bd00-7aeafeb9cde0/networkDevices', {\n  headers\n});"
