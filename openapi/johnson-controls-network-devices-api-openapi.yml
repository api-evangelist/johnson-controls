      example: 100
    objectType:
      name: objectType
      in: query
      description: 'The type of network device to return.


        The `objectType` query parameter cannot be used in conjunction with the

        `classification` query parameter.



        The acceptable values for this parameter come from the `objectTypeEnumSet` enumeration.

        Only the long name of the object type (for example, `objectTypeEnumSet.bacnetIntegrationClass` instead of `bacnetIntegrationClass`) is accepted.

        Find the definition of `objectTypeEnumSet` at the relative URL of `/schemas/enums/objectTypeEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      schema:
        type: string
      example: objectTypeEnumSet.bacnetIntegrationClass
      x-metasysType: enum
      x-metasysEnum: objectTypeEnumSet
    classification:
      name: classification
      in: query
      description: 'The classification to filter devices on. One or more values are supported.


        The `classification` query parameter cannot be used in conjunction with the

        `objectType` query parameter.

        '
      schema:
        type: array
        items:
          type: string
          enum:
          - device
          - integration
          - server
          - controller
      style: form
      explode: true
      examples:
        onlyDevices:
          summary: Only devices (excludes integrations)
          description: Includes servers, supervisory engines, and controllers (excludes integrations).
          value:
          - device
          - server
          - controller
        engines:
          summary: Only supervisory engines
          value:
          - device
        serversAndEngines:
          summary: Servers and supervisory engines
          value:
          - server
          - device
    devicesSort:
      name: sort
      in: query
      description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        default: name
        enum:
        - categoryId
        - -categoryId
        - firmwareVersion
        - -firmwareVersion
        - itemReference
        - -itemReference
        - name
        - -name
        - typeId
        - -typeId
