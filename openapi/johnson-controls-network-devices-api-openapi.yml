  /equipment/{equipmentId}/networkDevices:
    get:
      summary: List network devices hosting an equipment instance
      description: Retrieves the collection of network devices that host the specified equipment instance, along with the parents of those network devices. A network device hosts an equipment when the equipment defines points that map to an attribute of any object contained on the network device.
      operationId: getNetworkDevicesHostingEquipment
      parameters:
      - $ref: '#/components/parameters/equipmentId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/devicesSort'
      - name: classification
        x-releases:
          implementedAt: '15.0'
        in: query
        description: '<span style="color: #92989b; font-size: 13px">RELEASES</span>:<span style="color: #186faf;"> <strong>15.0 and later</strong></span>\

          The classification to filter devices on. One or more values are

          supported.


          The `classification` query parameter cannot be used in conjunction with

          the `objectType` query parameter.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - device
            - integration
            - server
            - controller
        style: form
        explode: true
        examples:
          onlyDevices:
            summary: Only devices (excludes integrations)
            description: Includes servers, supervisory engines, and controllers (excludes integrations).
            value:
            - device
            - server
            - controller
          engines:
            summary: Only supervisory engines
            value:
            - device
          serversAndEngines:
            summary: Servers and supervisory engines
            value:
            - server
            - device
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/networkDevices'
              examples:
                spaces:
                  $ref: '#/components/examples/networkDevicesHostingEquipment'
      tags:
      - network devices
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/equipment/b78fa672-3ec9-4794-bd00-7aeafeb9cde0/networkDevices \\\n  --header \"Authorization: Bearer $accessToken\""
