      summary: Get alarms for a network device
      description: Retrieves a collection of alarms for the specified network device.
      operationId: getNetworkDeviceAlarms
      parameters:
      - $ref: '#/components/parameters/networkDeviceId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/priorityRange'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/includeAcknowledged'
      - $ref: '#/components/parameters/includeDiscarded'
      - $ref: '#/components/parameters/includeAcknowledgementRequired'
      - $ref: '#/components/parameters/includeAcknowledgementNotRequired'
      - $ref: '#/components/parameters/equipment'
      - $ref: '#/components/parameters/object'
      - $ref: '#/components/parameters/space'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/page'
      - name: pageSize
        in: query
        description: The maximum number of items to return in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        example: 100
      - $ref: '#/components/parameters/alarmsSort'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/deviceAlarms'
              examples:
                tenAlarms:
