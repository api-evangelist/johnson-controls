  /alarms/{alarmId}:
    get:
      summary: Get an alarm
      description: Retrieves the specified alarm.
      operationId: getAlarm
      parameters:
      - $ref: '#/components/parameters/alarmId'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/alarm'
              examples:
                avAlarm:
                  $ref: '#/components/examples/av-alarm'
                bacnetAvAlarm:
                  $ref: '#/components/examples/bacnet-alarm'
      tags:
      - Alarms
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5 \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
