components:
  parameters:
    networkDeviceId:
      name: networkDeviceId
      description: The identifier of a network device.
      in: path
      required: true
      schema:
        type: string
      example: d9bf66bd-22f8-425b-82a4-44ba153d79c7
    endTime:
      name: endTime
      in: query
      description: Only include results generated on or before this date-time.
      schema:
        type: string
        format: date-time
      example: '2018-05-21T13:58:20.243Z'
    category:
      name: category
      in: query
      description: 'The authorization category of the requested activities.



        The acceptable values for the elements of this parameter come from the `objectCategoryEnumSet` enumeration.

        Only the long name of the object category (for example, `objectCategoryEnumSet.hvacCategory` instead of `hvacCategory`) is accepted.

        Find the definition of `objectCategoryEnumSet` at the relative URL of `/schemas/enums/objectCategoryEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        singleCategory:
          summary: HVAC category
          value:
          - objectCategoryEnumSet.hvacCategory
        multiplesCategories:
          summary: Multiple Categories
          value:
          - objectCategoryEnumSet.hvacCategory
          - objectCategoryEnumSet.fireCategory
      x-metasysEnum: objectCategoryEnumSet
      schema:
        type: array
        items:
          type: string
          x-metasysType: enum
          x-metasysEnum: objectCategoryEnumSet
    object:
      name: object
      in: query
      description: Filter by list of object identifiers.
      example:
      - 06d77c63-6357-467a-a306-5e1ab3eb3aa7
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    includeAcknowledgementRequired:
      name: includeAcknowledgementRequired
      in: query
      description: Determines whether alarms which can be acknowledged are included in the results. When the value is `true`, alarms which can be acknowledged will be included in the results. When `false`, alarms which can be acknowledged will not be included in the results.
      example: true
      schema:
        type: boolean
        default: true
    page:
      name: page
      in: query
      description: The page number of items to return.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    space:
      name: space
      in: query
      description: Filter by list of space identifiers.
      example:
      - 214f52d1-0c56-4a29-a690-abe5656d1647
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    equipment:
      name: equipment
      in: query
      description: Filter by list of equipment identifiers.
      example:
      - b7ed8b3e-cb95-410d-aaa7-37158852c398
      schema:
        type: array
        maxItems: 100
        items:
          type: string
    includeAcknowledgementNotRequired:
      name: includeAcknowledgementNotRequired
      in: query
      description: Determines whether alarms which can not be acknowledged are included in the results. When the value is `true` then the results will include alarms which cannot be acknowledged. When the value is `false` then the results will not include alarms which cannot be acknowledged.
      example: true
      schema:
        type: boolean
        default: true
    priorityRange:
      name: priorityRange
      in: query
      description: Includes only results within the specified alarm priority range, from 0 to 255 inclusive.
      schema:
        type: string
        pattern: ^\d+,\d+$
      example: 0,255
    alarmId:
      name: alarmId
      in: path
      description: The identifier of the alarm.
      required: true
      schema:
        type: string
      example: 4d0598d4-2836-4efd-84b8-6f39754b1fc5
    objectId:
      name: objectId
      in: path
      description: The identifier of the object.
      example: 32cfddc0-411f-5b9e-9a6d-442cb62fecbb
      required: true
      schema:
        type: string
    alarmsSort:
      name: sort
      in: query
      description: The criteria to use when sorting results (see [rules](#section/Sorting-Rules)).
      schema:
        type: string
        default: creationTime
        enum:
        - creationTime
        - -creationTime
        - priority
        - -priority
      example: creationTime
    includeDiscarded:
      name: includeDiscarded
      in: query
      description: "Determines whether discarded alarms will be included in the results or be\nthe only type of alarm in the results. Discarded alarms are those for which\nthe `activityManagementStatus` is `discarded`. This parameter can produce 3\ndifferent types of results.\n\n- `true` - Return only discarded alarms in the response.\n- `false` - Do not include any discarded alarms in the response.\n- _missing_ - (default) Discarded status is ignored; both discarded and\n  non-discarded alarms are returned.\n"
      example: false
      schema:
        type: boolean
    type:
      name: type
      in: query
      description: 'Limits the alarms returned to specified types.



        The acceptable values for the elements of this parameter come from the `alarmValueEnumSet` enumeration.

        Only the long name of the alarm value (for example, `alarmValueEnumSet.avHighLimit` instead of `avHighLimit`) is accepted.

        Find the definition of `alarmValueEnumSet` at the relative URL of `/schemas/enums/alarmValueEnumSet`.


        **See also:**

        * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
      examples:
        multiple:
          summary: Multiple Types
          value:
          - alarmValueEnumSet.avHighLimit
          - alarmValueEnumSet.avLowLimit
          x-use-in-snippets: true
      x-metasysEnum: alarmValueEnumSet
      schema:
        type: array
        items:
          type: string
          maxItems: 100
          x-metasysType: enum
          x-metasysEnum: alarmValueEnumSet
    includeAcknowledged:
      name: includeAcknowledged
      in: query
      description: "Determines whether acknowledged alarms will be included in the results or be\nthe only type of alarm in the results. Acknowledged alarms are those which\nhave an `acknowledgedTime` value set.\n\nThis parameter can produce 3 different types of results.\n\n- `true` - Return only acknowledged alarms in the response.\n- `false` - Do not include any acknowledged alarms in the response.\n- _missing_ - (default) Acknowledged status is ignored; both acknowledged\n  and non-acknowledged alarms are returned.\n"
      example: false
      schema:
        type: boolean
    startTime:
      name: startTime
      in: query
      description: Only include results generated on or after this date-time.
      schema:
        type: string
        format: date-time
      example: '2018-05-21T13:58:20.243Z'
