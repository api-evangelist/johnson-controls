  schemas:
    alarm:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: The identifier of the alarm.
        itemReference:
          type: string
          description: The fully qualified reference of the object.
        name:
          type: string
          description: The name of the object.
        description:
          type: string
          description: 'A more detailed description of the triggered alarm, either describing

            the object that triggered the alarm or the alarm itself.

            '
        activityManagementStatus:
          type: string
          description: "The activity management status of this item.\n\nThe values of this property are described as follows:\n\n- `pending` - Indicates the activity has not yet been acted upon by a\n  user.\n- `acknowledged` - Indicates that the activity has been recognized and\n  viewed by a user.\n- `discarded` - Indicates that the activity has been acted upon or\n  deemed invalid by a user.\n"
          enum:
          - pending
          - acknowledged
          - discarded
        discardedTime:
          type:
          - string
          - 'null'
          description: 'The date-time representing the time when this activity message was

            discarded.

            '
          format: date-time
        creationTime:
          type: string
          description: The date-time for when the alarm was detected.
          format: date-time
        acknowledgedTime:
          type:
          - string
          - 'null'
          description: 'The date-time representing the time when this activity message was

            acknowledged.

            '
          format: date-time
        objectUrl:
          type: string
          description: A link to the object from which this alarm was generated.
          format: uri
        message:
          type: string
          description: The alarm message.
        isAckRequired:
          type: boolean
          description: 'Indicates whether the alarm can be acknowledged. You will get an error

            response if you attempt to acknowledge an alarm for which this property

            is `false`.

            '
        type:
          type: string
          description: 'The type of alarm.


            The values for this property come from the `alarmValueEnumSet` enumeration.

            Find the definition of `alarmValueEnumSet` at the relative URL of `/schemas/enums/alarmValueEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: alarmValueEnumSet
        priority:
          type: integer
          description: The priority of the alarm.
        category:
          type: string
          description: 'The authorization category of the object when the alarm was generated.



            The values for this property come from the `objectCategoryEnumSet` enumeration.

            Find the definition of `objectCategoryEnumSet` at the relative URL of `/schemas/enums/objectCategoryEnumSet`.


            **See also:**

            * [Get enumeration](#operation/getEnumerationAsJsonSchema) for more information on retrieving an enumeration.'
          x-metasysType: enum
          x-metasysEnum: objectCategoryEnumSet
        annotationsUrl:
          type: string
          description: A link to the annotations available on the alarms.
          format: uri
        annotationsCount:
          type: integer
          description: The total number of annotations associated with the alarm.
        signedAnnotationsCount:
          type: integer
          description: 'The total number of MVE Annotations associated with the alarm.

            '
        self:
          type: string
          description: A link to this alarm.
          format: uri
        triggerValue:
          description: 'The digital value of the attribute of the object on which the alarm was

            triggered.

            '
          allOf:
          - type: object
            properties:
              item:
                oneOf:
                - type: number
                - type: string
              schema:
                type: object
            required:
            - item
            - schema
          - $ref: '#/components/schemas/anyDataTypeSchemaRequired'
        spaces:
          type: array
          description: 'The collection of spaces associated with the object on which the

            activity occurred.

            '
          items:
            $ref: '#/components/schemas/space'
        equipment:
          type: array
          description: 'The collection of equipment associated with the object on which the

            activity occurred.

            '
          items:
            $ref: '#/components/schemas/equipment'
        alarmGeneratorObject:
          description: 'Reference information to the object which generated the alarm.

            '
          allOf:
          - $ref: '#/components/schemas/nullableObjectReferenceDefinition'
        associatedGraphic:
          type:
          - object
          - 'null'
          description: 'Reference information for the graphic associated with the alarm.

            '
          properties:
            reference:
              description: 'Provides the fully qualified reference to the graphic associated

                with the alarm.

                '
              allOf:
              - $ref: '#/components/schemas/objectReferenceDefinition'
            url:
              type: string
              description: A link to the associated alarm graphic.
              format: uri
