openapi: 3.2.0
info:
  title: Johnson Controls Alarms API
  version: Version 6 for 16.0
  x-logo:
    url: source/images/logo.svg
    href: https://jci-metasys.github.io/
  x-releases:
  - '14.0'
  - '14.1'
  - '15.0'
  - '16.0'
  x-revision: 'Commit ID: 4b227676a'
  description: 'Operations tagged alarms across 2 of this provider''s published API definitions: metasys-api-v6-16.json, johnson-controls-metasys-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}/api/v6
  description: The base URL of all API routes
  variables:
    hostname:
      default: metasys-server.example.com
      description: This is the name of your site director device
security:
- Bearer-Authentication: []
tags:
- name: Alarms
  description: 'Alarms alert users to potential problems identified by a Metasys system, for

    example high zone temperatures. Use alarms operations to get object alarms,

    network device alarms, single alarms, alarm collections, and alarm annotations.

    Acknowledge or discard alarms with the edit patch operation. Filter the results

    with the query parameters time, priority, type, category, acknowledgement, and

    page. Sort the results by creation time and priority.'
paths:
  /objects/{objectId}/alarms:
    get:
      summary: Get alarms for an object
      description: Retrieves a collection of alarms for the specified object.
      operationId: getObjectAlarms
      parameters:
      - $ref: '#/components/parameters/objectId'
      - $ref: '#/components/parameters/startTime'
      - $ref: '#/components/parameters/endTime'
      - $ref: '#/components/parameters/priorityRange'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/includeAcknowledged'
      - $ref: '#/components/parameters/includeDiscarded'
      - $ref: '#/components/parameters/includeAcknowledgementRequired'
      - $ref: '#/components/parameters/includeAcknowledgementNotRequired'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/page'
      - name: pageSize
        in: query
        description: The maximum number of items to return in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        example: 100
      - $ref: '#/components/parameters/alarmsSort'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.metasysapi.v6+json:
              schema:
                $ref: '#/components/schemas/objectAlarms'
              examples:
                tenAlarms:
                  $ref: '#/components/examples/first-two-object-alarms'
      tags:
      - Alarms
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request GET \\\n  --url 'https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit' \\\n  --header \"Authorization: Bearer $accessToken\""
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .GetAsync();"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\" `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: '# Login with Connect-MetasysAccount first.

          # See PS Metasys Rest Client example for "authentication | Request access token".

          Invoke-MetasysMethod "/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit"'
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n};\n\nconst response = await axiosClient.get(\n  '/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\"\n}\n\nconn.request(\"GET\", url, headers=headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/objects/32cfddc0-411f-5b9e-9a6d-442cb62fecbb/alarms?type=alarmValueEnumSet.avHighLimit&type=alarmValueEnumSet.avLowLimit\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /networkDevices/{networkDeviceId}/alarms:
