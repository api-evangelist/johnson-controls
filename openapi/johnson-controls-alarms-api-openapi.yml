    patch:
      summary: Edit an alarm
      description: Allows for acknowledging or discarding an alarm.
      operationId: patchAlarm
      parameters:
      - $ref: '#/components/parameters/alarmId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                activityManagementStatus:
                  type: string
                  description: "The new activity management status of the alarm.\n\nThe values of this property are described as follows:\n\n- `acknowledged` - The alarm has been recognized and viewed by a\n  user. An alarm may only be acknowledged if\n  `activityManagementStatus` is currently `pending` and\n  `isAckRequired` is `true`.\n- `discarded` - The alarm has been acted upon and addressed by a\n  user. Once an alarm is discarded, it cannot be changed to any\n  other state.\n"
                  enum:
                  - acknowledged
                  - discarded
                annotationText:
                  type:
                  - string
                  - 'null'
                  description: The annotation associated with the change of alarm state.
              required:
              - activityManagementStatus
              example:
                activityManagementStatus: acknowledged
            examples:
              acknowledgeAlarm:
                summary: Acknowledge an alarm
                value:
                  activityManagementStatus: acknowledged
              discardAlarm:
                summary: Discard an alarm
                value:
                  activityManagementStatus: discarded
        required: true
      responses:
        '204':
          description: Success.
        '400':
          description: "Bad request. Changing the state of an alarm may fail for a few reasons:\n\n- Acknowledging an alarm may fail if it does not require acknowledgment.\n- Acknowledging an alarm may fail if it is already acknowledged or\n  already discarded.\n- Discarding an alarm may fail if it is already discarded.\n"
        '403':
          $ref: '#/components/responses/general403'
      tags:
      - Alarms
      x-codeSamples:
      - lang: shell
        label: Shell + Curl
        source: "# To set accessToken see the Shell + Curl example for \"authentication | Request access token\"\ncurl --request PATCH \\\n  --url https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5 \\\n  --header \"Authorization: Bearer $accessToken\" \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"activityManagementStatus\":\"acknowledged\"}'"
      - lang: csharp
        label: C# + Flurl
        source: "// See CSharp + Flurl example for \"authentication | Request access token\"\n// to see how to import Flurl and set `accessToken` variable\nvar response = await \"https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5\"\n    .WithHeader(\"Authorization\", $\"Bearer {accessToken}\")\n    .WithHeader(\"Content-Type\", \"application/json\")\n    .PatchStringAsync(\"{\\\"activityManagementStatus\\\":\\\"acknowledged\\\"}\");"
      - lang: text
        label: Powershell
        source: "# To set $accessToken see the Powershell example of \"authentication | Request a token\"\nInvoke-RestMethod \"https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5\" `\n  -Method Patch `\n  -Body '{\"activityManagementStatus\":\"acknowledged\"}' `\n  -Headers @{\n    Authorization = \"Bearer $accessToken\"\n    'Content-Type' = 'application/json'\n  }"
      - lang: text
        label: PS Metasys Rest Client
        source: "# Login with Connect-MetasysAccount first.\n# See PS Metasys Rest Client example for \"authentication | Request access token\".\nInvoke-MetasysMethod /alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5 `\n  -Method Patch `\n  -Body '{\"activityManagementStatus\":\"acknowledged\"}'"
      - lang: javascript
        label: Node + Axios
        source: "// See Node + Axios example of \"authentication | Request access token\"\n// to see how to initialize the variables `axiosClient` and `accessToken`\n\nconst headers = {\n  'Authorization': `Bearer ${accessToken}`,\n  'Content-Type': 'application/json',\n};\n\nconst response = await axiosClient.patch(\n  '/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5',\n  '{\"activityManagementStatus\":\"acknowledged\"}', {\n  headers\n});"
      - lang: python
        label: Python
        source: "# See Python example for \"authentication | Request access token\"\n# to see how to create conn object and set `access_token` variable\nurl = \"/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5\"\nheaders = {\n    \"Authorization\": f\"Bearer {access_token}\" ,\n    \"Content-Type\": \"application/json\"\n}\npayload = \"{\\\"activityManagementStatus\\\":\\\"acknowledged\\\"}\"\n\nconn.request(\"PATCH\", url, payload, headers)\n\nres = conn.getresponse()"
      - lang: java
        label: Java
        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .header(\"content-type\", \"application/json\")\n    .method(\"PATCH\", HttpRequest.BodyPublishers.ofString(\"{\\\"activityManagementStatus\\\":\\\"acknowledged\\\"}\"))\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
          description: This is the name of your site director device
  /alarms/{alarmId}/annotations:
