        source: "// See Java example for \"authentication | Request access token\"\n// to see how to set `accessToken` variable\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://metasys-server.example.com/api/v6/alarms/4d0598d4-2836-4efd-84b8-6f39754b1fc5/annotations\"))\n    .header(\"Authorization\", \"Bearer \" + accessToken)\n    .method(\"GET\", HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse<String> response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());"
    servers:
    - url: https://{hostname}/api/v6
      description: The base URL of all API routes
      variables:
        hostname:
          default: metasys-server.example.com
