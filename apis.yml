            "annotationsUrl": "https://metasys-server.example.com/api/v6/alarms/6443a123-ddcd-47e7-9828-d872db6a7b4f/annotations",
            "self": "https://metasys-server.example.com/api/v6/audits/128d7db4-8ab6-4232-afe1-026fe06d267f"
          }
        },
        "effectivePermission": {
          "id": "128d7db4-8ab6-4232-afe1-026fe06d267f",
          "canDiscard": true
        }
      }
      ```

      </details>

    #### Filter Behavior


    Filters supplied to an activities request limit the results to activities for

    which the filters apply. When subscribing to an activities request that uses

    filters, the events received are also limited to the same filter criteria.

    Exceptions to this behavior occur when filtering on activity management status,

    such as for `acknowledged` or `discarded` activities. You receive an update

    whenever an activity management change occurs, regardless of filters, because

    the change can impact the original set of activities you subscribed to. For

    example, consider the following scenario:


    - You subscribe to `acknowledged` activities and receive all acknowledged
      activities, receiving updates for any acknowledged thereafter across the
      stream.
    - In this state, one of the activities in your original list is `discarded` by
      another user.

    When this occurs, you receive an `activity.alarm.discard` message for the

    discarded activity even though your filters exclude activities that are

    `discarded`. This is necessary so that you can properly maintain the state of

    activities already received in your application.
