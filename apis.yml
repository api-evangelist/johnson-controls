apis:
- aid: johnson-controls:johnson-controls-activities-api
  name: Johnson Controls Activities API
  description: >-
    This section describes the operations you can perform on activities. Activities

    are a superset of all alarms and audits in a Metasys system. Use activities

    operations to view audits and alarms. Apply filters to further refine the

    results.


    ## Activities Event Subscriptions


    Subscribe for activity-related events to receive updates when activities are

    created, discarded, acknowledged, or annotated.


    #### Subscribing


    To subscribe for activity-related events, complete the following steps:


    1. Obtain a stream ID using the workflow outlined in the
       [Streaming](#section/Streaming) section.
    2. Use [Get Activities](#operation/getActivities) and include a
       `METASYS-SUBSCRIBE` header with the stream ID.

    **Note:** Any filters added to the original `GET` operation also apply the event

    subscription.


    #### Unsubscribing


    To unsubscribe from an activities event subscription, complete the following

    steps:


    1. Get the `METASYS-SUBSCRIPTION-LOCATION` from the subscribe operation
       response.
    2. Issue a
       [Delete activities subscription](#operation/deleteActivitiesSubscription)
       request to `METASYS-SUBSCRIPTION-LOCATION`.

    **See also:**


    - [Get a stream](#operation/getStream)

    - [Streaming](#tag/streaming)


    #### Events


    There are five event types sent by the activities subscription: acknowledged,

    annotate, discard, new, and heartbeat.


    - `activity.heartbeat` - A heartbeat event is sent to show that the subscription
      is still alive. A heartbeat is a JSON string with the current UTC date time in
      ISO 8601 format and is sent every 120 seconds.

      <details>
        <summary><b>Heartbeat Payload Example</b></summary>

      ```json
      {
        "currentTime": "2021-02-16T16:21:10.23Z",
        "subscriptionIds": ["c569a157-7315-4f32-bc8f-11607f075660"]
      }
      ```

      </details>

    - `activity.alarm.ack` - An alarm acknowledge event is sent to indicate that the
      management status has changed to acknowledged.

