- aid: johnson-controls:johnson-controls-audits-api
  name: Johnson Controls Audits API
  description: >-
    How to retrieve, discard, and annotate audits.


    ### Relationships


    Audits have relationships to other resources in the system. Find information

    about the most important below.


    - **objects**


    When users or the system affect objects in the Metasys system, such as analog

    inputs, multistate objects, or binary outputs, audits are generated. Those

    "acted upon" objects then relate to those audits. That relationship is returned

    as part of any audit response.


    - **equipment instances**


    Equipment instance associations to audits build off of the objects association

    explanation. Each equipment instance can contain many points, such as Outdoor

    Air Temperature, Damper Position, or Zone Setpoint. Those points map to actual

    objects in Metasys, as noted above. When users or the system affect those

    objects, audits are generated. If an equipment instance's point is mapped to one

    of those affected objects the instance is then associated with that audit.


    In short, an equipment instance contains points which map to Metasys objects

    which are affected by an audited action.


    - **spaces**


    Space associations to audits build off of the equipment instance association

    explanation. Equipment instances can serve spaces, such as an Air Handler Unit

    (AHU) serving the floor of a building. Therefore, audits associated with a

    particular equipment instance are associated to the spaces they serve.
